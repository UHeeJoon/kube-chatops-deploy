# Slack 토큰: Vault secret/kube-chatops/slack (사람이 넣음).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-gateway-slack
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: chat-gateway-slack, creationPolicy: Owner }
  data:
    - secretKey: app_token
      remoteRef: { key: kube-chatops/slack, property: app_token }
    - secretKey: bot_token
      remoteRef: { key: kube-chatops/slack, property: bot_token }
---
# gateway ↔ n8n 토큰 2개는 클러스터 안에서만 쓰므로 사람이 만들지 않고 ESO 가 생성한다 (처음 한 번).
# chat-n8n-webhook: gateway → n8n webhook 인증, chat-gateway-api: n8n → gateway API 인증.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: api-token
  namespace: aiops
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-n8n-webhook
  namespace: aiops
spec:
  refreshInterval: "0"
  target:
    name: chat-n8n-webhook
    template:
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: api-token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-gateway-api
  namespace: aiops
spec:
  refreshInterval: "0"
  target:
    name: chat-gateway-api
    template:
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: api-token }
