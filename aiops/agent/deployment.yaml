# agent: LangGraph 조사 에이전트. n8n 이 /route, /investigate 를 호출한다 (Bearer 토큰).
# 상태(대화 체크포인트, 일일 비용 장부)는 aiops-pg 의 agent DB. 파드는 상태가 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: aiops
  labels: { app.kubernetes.io/name: agent, app.kubernetes.io/part-of: kube-chatops }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agent, app.kubernetes.io/part-of: kube-chatops }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60 # 진행 중인 조사를 끝낼 시간
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/uheejoon/kube-chatops/agent@sha256:7112b196ee0276cecc56abf3b7d22ae6d7233f6994e3a073a1f79802f20bc81b
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - secretRef: { name: agent } # API_TOKEN, ANTHROPIC_API_KEY, MCP_TOKEN_*
          env:
            - { name: PG_HOST, value: aiops-pg-rw.aiops.svc }
            - name: PG_USER
              valueFrom: { secretKeyRef: { name: aiops-pg-agent, key: username } }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: aiops-pg-agent, key: password } }
            - { name: MODEL, value: claude-opus-5-5 }
            - { name: ROUTE_MODEL, value: claude-haiku-5-5 }
            - { name: INVESTIGATE_EFFORT, value: medium }
            - { name: DAILY_BUDGET_USD, value: "5" }
            - { name: MAX_REQUEST_USD, value: "0.6" }
            - { name: MAX_TOOL_CALLS, value: "15" }
            - { name: MAX_SECONDS, value: "180" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.monitoring.svc:4317" }
            # MCP 서버 목록 (이름=URL). 토큰은 Secret agent 의 MCP_TOKEN_<이름>
            - name: MCP_SERVERS
              value: "prometheus=http://mcp-prometheus.mcp.svc:8080/mcp,loki=http://mcp-loki.mcp.svc:8080/mcp,k8s=http://mcp-k8s.mcp.svc:8080/mcp,anomaly=http://mcp-anomaly.mcp.svc:8080/mcp,runbook=http://mcp-runbook.aiops.svc:8080/mcp"
            # mcp-runbook 토큰은 Vault 가 아니라 클러스터 안에서 만든 Secret (aiops/mcp-runbook/externalsecret.yaml)
            - name: MCP_TOKEN_RUNBOOK
              valueFrom: { secretKeyRef: { name: mcp-runbook, key: token } }
            # 사건 보고를 여기로 보내 similar_incidents 가 찾게 한다
            - { name: RUNBOOK_INGEST_URL, value: "http://mcp-runbook.aiops.svc:8080/ingest" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: aiops
  labels: { app.kubernetes.io/name: agent }
spec:
  selector: { app.kubernetes.io/name: agent }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent
  namespace: aiops
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: agent }
  endpoints:
    - { port: metrics, path: /metrics, interval: 30s }
