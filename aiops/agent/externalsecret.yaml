# Secret agent: 환경 변수 이름 그대로 키를 만든다 (envFrom).
#   API_TOKEN          ← secret/kube-chatops/agent    api_token   (n8n 도 같은 값을 쓴다)
#   ANTHROPIC_API_KEY  ← secret/kube-chatops/anthropic api_key
#   MCP_TOKEN_*        ← secret/kube-chatops/mcp      prometheus, loki, k8s (각 MCP 서버와 같은 값)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: agent
    creationPolicy: Owner
  data:
    - { secretKey: API_TOKEN, remoteRef: { key: kube-chatops/agent, property: api_token } }
    - { secretKey: ANTHROPIC_API_KEY, remoteRef: { key: kube-chatops/anthropic, property: api_key } }
    - { secretKey: MCP_TOKEN_PROMETHEUS, remoteRef: { key: kube-chatops/mcp, property: prometheus } }
    - { secretKey: MCP_TOKEN_LOKI, remoteRef: { key: kube-chatops/mcp, property: loki } }
    - { secretKey: MCP_TOKEN_K8S, remoteRef: { key: kube-chatops/mcp, property: k8s } }
