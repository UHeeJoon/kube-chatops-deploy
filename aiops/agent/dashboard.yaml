# Grafana 대시보드: LLM 비용, 예산, 조사 결과, MCP 도구.
# Grafana 사이드카가 모든 ns 에서 grafana_dashboard=1 라벨 ConfigMap 을 읽는다 (homelab 변경 불필요).
# 수정은 Grafana 에서 하지 말고 이 파일에서 (사이드카가 덮어쓴다). 생성: python3 scripts/gen-agent-dashboard.py aiops/agent/dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-cost-dashboard
  namespace: aiops
  labels:
    grafana_dashboard: "1"
data:
  kube-chatops-llm-cost.json: |
    {
     "uid": "kube-chatops-llm-cost",
     "title": "kube-chatops / LLM 비용과 에이전트",
     "tags": [
      "kube-chatops",
      "llm",
      "cost"
     ],
     "timezone": "Asia/Seoul",
     "refresh": "1m",
     "time": {
      "from": "now-24h",
      "to": "now"
     },
     "schemaVersion": 39,
     "editable": true,
     "templating": {
      "list": [
       {
        "name": "datasource",
        "label": "Prometheus",
        "type": "datasource",
        "query": "prometheus",
        "current": {},
        "hide": 0
       }
      ]
     },
     "panels": [
      {
       "type": "row",
       "title": "예산",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "stat",
       "title": "오늘 사용액 (KST)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "max(agent_budget_spent_today_usd)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD",
         "decimals": 2
        },
        "overrides": []
       },
       "options": {},
       "description": "Postgres 장부 기준 오늘 누적. 자정(KST)에 0"
      },
      {
       "type": "stat",
       "title": "일일 예산",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 4,
        "y": 1,
        "w": 3,
        "h": 5
       },
       "targets": [
        {
         "expr": "max(agent_budget_daily_limit_usd)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "gauge",
       "title": "예산 사용률",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 7,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "100 * max(agent_budget_spent_today_usd) / max(agent_budget_daily_limit_usd)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percent",
         "min": 0,
         "max": 100,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 70
           },
           {
            "color": "red",
            "value": 90
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "100% 가 되면 agent 가 새 요청을 429 로 거절"
      },
      {
       "type": "stat",
       "title": "최근 24시간 비용",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 11,
        "y": 1,
        "w": 3,
        "h": 5
       },
       "targets": [
        {
         "expr": "sum(increase(agent_llm_cost_usd_total[24h]))",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD",
         "decimals": 2
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "stat",
       "title": "조사 1건 평균 비용 (24h)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 14,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "sum(increase(agent_llm_cost_usd_total{stage=~\"investigate|report\"}[24h])) / clamp_min(sum(increase(agent_requests_total{api=\"investigate\",status=\"200\"}[24h])), 1)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD",
         "decimals": 3
        },
        "overrides": []
       },
       "options": {},
       "description": "요청당 상한 MAX_REQUEST_USD 와 비교"
      },
      {
       "type": "stat",
       "title": "프롬프트 캐시 적중률 (24h)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 18,
        "y": 1,
        "w": 3,
        "h": 5
       },
       "targets": [
        {
         "expr": "sum(increase(agent_llm_tokens_total{kind=\"cache_read\"}[24h])) / sum(increase(agent_llm_tokens_total{kind=~\"input|cache_read|cache_write\"}[24h]))",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "orange",
            "value": 0.3
           },
           {
            "color": "green",
            "value": 0.6
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "입력 토큰 중 캐시에서 읽은 비율. 높을수록 싸다 (캐시 읽기는 입력 단가의 0.1배)"
      },
      {
       "type": "stat",
       "title": "조사 수 (24h)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 21,
        "y": 1,
        "w": 3,
        "h": 5
       },
       "targets": [
        {
         "expr": "sum(increase(agent_requests_total{api=\"investigate\",status=\"200\"}[24h]))",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "decimals": 0
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "row",
       "title": "비용과 토큰",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 6,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "시간당 비용 (단계별)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 7,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum by (stage) (increase(agent_llm_cost_usd_total[1h]))",
         "legendFormat": "{{stage}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD",
         "custom": {
          "drawStyle": "bars",
          "stacking": {
           "mode": "normal"
          },
          "fillOpacity": 80
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "route: 의도 분류, investigate: 도구 루프, report: 최종 보고서"
      },
      {
       "type": "timeseries",
       "title": "토큰 (종류별, 시간당)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 7,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum by (kind) (increase(agent_llm_tokens_total[1h]))",
         "legendFormat": "{{kind}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "bars",
          "stacking": {
           "mode": "normal"
          },
          "fillOpacity": 80
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "input: 캐시 안 된 입력, cache_write: 캐시에 쓴 입력(1.25배), cache_read: 캐시에서 읽은 입력(0.1배), output: 출력"
      },
      {
       "type": "timeseries",
       "title": "모델별 비용 (시간당)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 15,
        "w": 12,
        "h": 7
       },
       "targets": [
        {
         "expr": "sum by (model) (increase(agent_llm_cost_usd_total[1h]))",
         "legendFormat": "{{model}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD"
        },
        "overrides": []
       },
       "options": {},
       "description": "fallback 으로 다른 모델이 응답하면 여기 따로 보인다"
      },
      {
       "type": "timeseries",
       "title": "오늘 누적 사용액 vs 예산",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 15,
        "w": 12,
        "h": 7
       },
       "targets": [
        {
         "expr": "max(agent_budget_spent_today_usd)",
         "legendFormat": "사용액",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        },
        {
         "expr": "max(agent_budget_daily_limit_usd)",
         "legendFormat": "예산",
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "currencyUSD"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "row",
       "title": "요청과 조사",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 22,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "API 요청 (시간당)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 23,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "sum by (api, status) (increase(agent_requests_total[1h]))",
         "legendFormat": "{{api}} {{status}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {},
       "description": "401: 토큰 오류, 429: 예산 초과, 500: 내부 오류"
      },
      {
       "type": "bargauge",
       "title": "조사 종료 이유 (24h)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 23,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "sum by (reason) (increase(agent_investigation_stops_total[24h]))",
         "legendFormat": "{{reason}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {
        "displayMode": "basic",
        "orientation": "horizontal"
       },
       "description": "done: 정상, llm_calls / tool_calls / time / cost: 상한 도달, refusal: 모델 거절"
      },
      {
       "type": "timeseries",
       "title": "처리 시간 p95",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 23,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "histogram_quantile(0.95, sum by (le, api) (rate(agent_request_duration_seconds_bucket[$__rate_interval])))",
         "legendFormat": "{{api}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "row",
       "title": "MCP 도구",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 30,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "도구 호출 (시간당)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 31,
        "w": 10,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum by (server, tool) (increase(agent_tool_calls_total[1h]))",
         "legendFormat": "{{server}}/{{tool}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {},
       "description": "도구 호출이 많을수록 입력 토큰이 늘어난다"
      },
      {
       "type": "timeseries",
       "title": "도구 실행 p95 (MCP 서버)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 10,
        "y": 31,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "expr": "histogram_quantile(0.95, sum by (le, job, tool) (rate(mcp_tool_duration_seconds_bucket[$__rate_interval])))",
         "legendFormat": "{{job}}/{{tool}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "stat",
       "title": "도구 오류 (24h)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 18,
        "y": 31,
        "w": 3,
        "h": 4
       },
       "targets": [
        {
         "expr": "sum(increase(agent_tool_calls_total{status=\"error\"}[24h]))",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "stat",
       "title": "MCP 인증 실패 (24h)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 21,
        "y": 31,
        "w": 3,
        "h": 4
       },
       "targets": [
        {
         "expr": "sum(increase(mcp_auth_failures_total[24h]))",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "0 이 아니면 토큰 불일치 또는 무단 접근 시도"
      },
      {
       "type": "stat",
       "title": "입력 오류 (24h)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 18,
        "y": 35,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "expr": "sum(increase(mcp_tool_calls_total{status=\"invalid\"}[24h]))",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "options": {},
       "description": "모델이 허용 범위 밖 값(다른 ns, 너무 긴 기간 등)을 넣은 횟수"
      }
     ],
     "annotations": {
      "list": []
     }
    }
