       "type": "n8n-nodes-base.webhook",
       "typeVersion": 2,
       "position": [
        0,
        400
       ],
       "parameters": {
        "httpMethod": "POST",
        "path": "alert",
        "authentication": "headerAuth",
        "responseMode": "onReceived",
        "options": {}
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kchookalert00001",
