      {
       "id": "1524dc70-ff00-58d6-81b2-b89cd9f7cd17",
       "name": "알림 스레드",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        660,
        400
       ],
       "parameters": {
        "jsCode": "const p = $('격리 반영').isExecuted ? $('격리 반영').item.json : $('알림 정리').item.json;\nif ($json.statusCode !== 200) throw new Error(`알림 글 올리기 실패: ${$json.statusCode} ${JSON.stringify($json.body).slice(0, 200)}`);\nreturn [{ json: { channel_id: $json.body.channel, thread_id: $json.body.ts, question: p.question, alert: p.alert,\n  quarantine: p.quarantine ?? null, user_id: 'alertmanager', role: 'system', source: 'alert', started_at: Date.now() } }];"
       }
      },
      {
       "id": "d63b2728-99a0-5aaa-9def-e735e442ca52",
       "name": "조사 요청",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        880,
        200
       ],
       "parameters": {
        "jsCode": "// 두 입구(WF-01, 알림)를 같은 모양으로. agent 의 thread_id 는 Slack 채널 + 스레드 → 후속 질문이 이어진다.\nconst it = $json;\nreturn [{ json: { channel_id: it.channel_id, thread_id: it.thread_id, question: it.question, alert: it.alert ?? null,\n  mode: it.mode === 'answer' ? 'answer' : 'investigate', route_cost: it.route_cost ?? 0,\n  user_id: it.user_id, role: it.role, source: it.source ?? 'chat', started_at: it.started_at ?? Date.now(),\n  quarantine: it.quarantine ?? null,\n  agent_thread: `slack-${it.channel_id}-${it.thread_id}` } }];"
       }
      },
      {
       "id": "49a9d321-f5af-586a-a720-3d72208381cd",
       "name": "조사 중 표시",
       "type": "n8n-nodes-base.httpRequest",
       "typeVersion": 4.2,
       "position": [
        1100,
        200
       ],
       "parameters": {
        "method": "POST",
        "url": "http://chat-gateway.aiops.svc:8080/slack/post",
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth",
        "sendBody": true,
        "specifyBody": "json",
        "jsonBody": "={{ JSON.stringify({ channel: $json.channel_id, thread_ts: $json.thread_id, text: $json.mode === 'answer' ? ':hourglass_flowing_sand: 확인하고 있습니다.' : ':mag: 조사하고 있습니다. 보통 30~60초 걸립니다.' }) }}",
        "options": {
         "timeout": 30000,
         "response": {
          "response": {
           "fullResponse": true,
           "neverError": true
          }
         }
        }
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kcgatewayapi0001",
         "name": "chat-gateway API"
        }
       }
      },
      {
       "id": "c26fd410-03ae-52f9-9c7c-a097b57bd786",
       "name": "조사",
       "type": "n8n-nodes-base.httpRequest",
       "typeVersion": 4.2,
       "position": [
        1320,
        200
       ],
       "parameters": {
        "method": "POST",
        "url": "http://agent.aiops.svc:8080/investigate",
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth",
        "sendBody": true,
        "specifyBody": "json",
        "jsonBody": "={{ JSON.stringify({ thread_id: $('조사 요청').item.json.agent_thread, question: $('조사 요청').item.json.question, alert: $('조사 요청').item.json.alert, mode: $('조사 요청').item.json.mode }) }}",
        "options": {
         "timeout": 240000,
         "response": {
          "response": {
           "fullResponse": true,
           "neverError": true
          }
         }
        }
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kcagentapi000001",
         "name": "agent API"
        }
       }
      },
      {
       "id": "ecb553b4-9dd9-58fa-bb20-2cb14578728a",
       "name": "보고서 만들기",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        1540,
        200
       ],
       "parameters": {
        "jsCode": "// agent 결과 → Slack 메시지 (mrkdwn). 보고서는 상태 한 줄 + 영향/원인/조치/미확인 목록, 질문 답은 그대로.\nconst req = $('조사 요청').item.json;\nconst res = $json;\nconst secs = Math.round((Date.now() - req.started_at) / 1000);\nconst clip = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };\nconst list = (xs, n, w) => (xs ?? []).slice(0, n).map(x => `• ${clip(x, w)}`).join('\\n');\n// 모델이 일반 마크다운을 쓰면 Slack 형식으로 바꾼다 (**굵게** → *굵게*, - 목록 → •, # 제목 → 굵게)\nconst toSlack = t => String(t ?? '')\n  .replace(/\\*\\*(.+?)\\*\\*/g, '*$1*')\n  .replace(/^\\s*[-*] /gm, '• ')\n  .replace(/^#{1,6}\\s*(.+)$/gm, '*$1*');\nconst u0 = res.body?.usage ?? {};\nconst cost = (u0.cost_usd ?? 0) + (req.route_cost ?? 0);  // 의도 분류 비용까지 합친 요청 하나의 비용\nconst llm = (u0.llm_calls ?? 0) + (req.route_cost ? 1 : 0);\nconst stopped = res.body?.stopped_by && !['done', 'repeat'].includes(res.body.stopped_by) ? ` · 한도 도달로 중단(${res.body.stopped_by})` : '';\nconst foot = { type: 'context', elements: [{ type: 'mrkdwn',\n  text: `도구 ${res.body?.tool_calls ?? 0}회 · LLM ${llm}회 · $${cost.toFixed(3)} · ${secs}초${stopped}` +\n    (res.body?.incident ? ` · 사건 #${res.body.incident.incident_id} 의 ${res.body.incident.report_no}번째 보고 (\\`@봇 사건 ${res.body.incident.incident_id}\\` 로 전체 보기)` : '') }] };\nconst sec = t => ({ type: 'section', text: { type: 'mrkdwn', text: clip(t, 2900) } });\n// 조사 중 읽은 데이터(로그, 요청)에 지시처럼 보이는 문장이 있었으면 사람에게 알린다. 보고서가 그 문장에 휘둘렸을 수 있다.\nconst sus = res.body?.injection_suspected ?? [];\nif (sus.length) foot.elements.push({ type: 'mrkdwn', text: `:warning: 조사한 데이터에 *지시처럼 보이는 문장* 이 있었음 (${sus.map(x => '`' + x + '`').join(', ')}). 에이전트는 따르지 않도록 되어 있지만, 결론과 조치 제안을 원본 로그로 한 번 확인하세요. 이 보고서에는 승인 버튼을 붙이지 않았습니다.` });\nlet blocks = [], text, result;\nif (res.statusCode === 200 && res.body?.answer && !res.body?.report) {  // 질문 답, 또는 보고서 없이 글로 끝난 조사\n  result = 'answer';\n  const a = toSlack(res.body.answer);\n  text = clip(a, 300);\n  blocks = [sec(a), foot];\n} else if (res.statusCode === 200 && res.body?.report) {\n  const r = res.body.report;\n  result = 'ok';\n  const icon = { critical: ':red_circle:', warning: ':large_yellow_circle:', ok: ':large_green_circle:' }[r.status] ?? ':white_circle:';\n  const label = { critical: '장애', warning: '주의', ok: '정상' }[r.status] ?? '';\n  text = `${label} · ${clip(r.headline, 200)}`;\n  blocks.push(sec(`${icon} *${label}* · ${clip(r.headline, 150)}`));\n  if (r.impact?.length) blocks.push(sec(`*영향*\\n${list(r.impact, 3, 90)}`));\n  if (r.timeline?.length) blocks.push(sec(`*경과*\\n${r.timeline.slice(0, 5).map(t => `• \\`${clip(t.time, 11)}\\` ${clip(t.event, 80)}`).join('\\n')}`));\n  if (r.causes?.length) {\n    const lines = r.causes.slice(0, 2).map((c, i) =>\n      `${i + 1}. ${clip(c.title, 90)}  \\`${Math.round((c.confidence ?? 0) * 100)}%\\`\\n` +\n      (c.evidence ?? []).slice(0, 3).map(e => `      ◦ ${clip(e, 90)}`).join('\\n'));\n    blocks.push(sec(`*원인*\\n${lines.join('\\n')}`));\n  }\n  const risk = { low: '낮음', medium: '중간', high: '높음' };\n  const acts = (r.actions ?? []).filter(a => a.type !== 'none').slice(0, 2);\n  if (acts.length) {\n    blocks.push(sec(`*조치 제안* _(승인 전에는 실행하지 않음)_\\n` +\n      acts.map(a => `• \\`${a.type}\\` ${a.target} · 위험 ${risk[a.risk] ?? a.risk}\\n      ◦ ${clip(a.reason, 90)}`).join('\\n')));\n  }\n  // 승인 버튼. 글자와 확인 창은 여기 고정 문구만 쓴다 (모델이 쓴 문장을 버튼에 넣지 않는다). 대상은 허용 목록에 있는 것만.\n  const APPROVE = {\n    restart: ['재시작 승인', '파드를 하나씩 다시 시작합니다 (rollout restart). 서비스는 유지됩니다. 메모리와 주입된 장애 상태가 초기화됩니다.'],\n    rollback: ['롤백 승인', '배포 저장소에서 이 Deployment 의 마지막 변경(이미지 또는 설정) 하나를 취소하는 커밋을 올립니다. 검사 → Argo CD 반영까지 3~5분 걸립니다.'],\n    scale: ['증설 승인 (+1)', 'replicas 를 1 늘리는 커밋을 배포 저장소에 올립니다 (최대 4). 반영까지 3~5분 걸립니다.'],\n  };\n  const btns = [];\n  // 조사한 데이터에 지시처럼 보이는 문장이 있었으면 승인 버튼을 붙이지 않는다. 조치 제안 자체가 그 문장의 결과일 수 있으므로\n  // 버튼 하나로 실행되게 두지 않고, 사람이 원본을 확인한 뒤 직접 하게 한다 (제안 내용은 보고서에 그대로 보인다).\n  for (const a of (sus.length ? [] : acts)) {\n    const m = /(?:^|\\/)(demo-app)$/.exec(String(a.target ?? '').trim());\n    if (a.type === 'retrain' && !btns.some(b => b.action_id === 'mlops_retrain')) {\n      btns.push({ type: 'button', action_id: 'mlops_retrain', value: 'anomaly-train', text: { type: 'plain_text', text: '재학습 시작' } });\n    } else if (m && APPROVE[a.type] && !btns.some(b => b.action_id === `act_${a.type}`)) {\n      btns.push({ type: 'button', action_id: `act_${a.type}`, value: `demo/${m[1]}`, text: { type: 'plain_text', text: APPROVE[a.type][0] },\n        confirm: { title: { type: 'plain_text', text: `${a.type} demo/${m[1]}` }, confirm: { type: 'plain_text', text: '실행' }, deny: { type: 'plain_text', text: '취소' },\n          text: { type: 'mrkdwn', text: `\\`demo/${m[1]}\\` ${APPROVE[a.type][1]}` } } });\n    }\n  }\n  if (btns.length) blocks.push({ type: 'actions', elements: btns });\n  if (r.data_gaps?.length) blocks.push(sec(`*확인 못 한 것*\\n${list(r.data_gaps, 2, 90)}`));\n  const q = req.quarantine;\n  if (q?.done) {  // 선 조치로 격리한 파드: 조사가 끝나면 사람이 지운다\n    blocks.push(sec(`:lock: *격리된 파드* \\`${q.namespace}/${q.pod}\\`\\n• 증거 확인: \\`kubectl -n ${q.namespace} logs ${q.pod}\\` · \\`kubectl -n ${q.namespace} exec ${q.pod} -- ...\\` (네트워크만 막혀 있음)\\n• 원래 라벨은 어노테이션 \\`security.kube-chatops/original-labels\\``));\n    blocks.push({ type: 'actions', elements: [{ type: 'button', style: 'danger', action_id: 'sec_delete_pod', value: `${q.namespace}/${q.pod}`,\n      text: { type: 'plain_text', text: '격리 파드 삭제 (조사 끝)' },\n      confirm: { title: { type: 'plain_text', text: '격리 파드 삭제' }, confirm: { type: 'plain_text', text: '삭제' }, deny: { type: 'plain_text', text: '취소' },\n        text: { type: 'mrkdwn', text: `\\`${q.pod}\\` 를 지웁니다. 로그와 파일 같은 증거도 함께 사라집니다.` } } }] });\n  }\n  if (r.references?.length) blocks.push({ type: 'context', elements: [{ type: 'mrkdwn', text: `참고: ${r.references.slice(0, 3).map(x => clip(x, 60)).join(' · ')}` }] });\n  blocks.push({ type: 'divider' });\n  blocks.push(foot);\n} else if (res.statusCode === 429) {\n  result = 'budget'; text = ':warning: 오늘 AI 사용 예산을 다 써서 조사하지 못했습니다.';\n} else {\n  result = 'error'; text = `:warning: 조사에 실패했습니다 (agent ${res.statusCode ?? '연결 실패'}). 잠시 후 다시 시도해 주세요.`;\n}\nreturn [{ json: { channel: req.channel_id, ts: $('조사 중 표시').item.json.body?.ts, text, blocks: blocks.length ? blocks : null,\n  audit: { flow: 'wf-02-investigate', result, source: req.source, user_id: req.user_id, role: req.role,\n    channel_id: req.channel_id, thread_id: req.thread_id, seconds: secs, agent_status: res.statusCode,\n    mode: req.mode, cost_usd: cost, tool_calls: res.body?.tool_calls ?? 0, stopped_by: res.body?.stopped_by ?? null,\n    quarantine: req.quarantine ? `${req.quarantine.pod}:${req.quarantine.done ? 'done' : 'failed'}` : null,\n    // 어떤 알림의 조사였는지 (공격 재현 평가 scripts/attack-replay.py 가 보고를 공격과 짝짓는 데 쓴다)\n    incident_id: res.body?.incident?.incident_id ?? null, injection_suspected: sus.length,\n    alert: req.alert?.alerts?.[0]?.labels?.alertname ?? null,\n    alert_pod: req.alert?.alerts?.[0]?.labels?.pod ?? req.alert?.alerts?.[0]?.labels?.source_workload ?? null } } }];"
       }
      },
