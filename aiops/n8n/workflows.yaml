  name: n8n-workflows
  namespace: aiops
  labels: { app.kubernetes.io/name: n8n }
data:
  wf-01-intake.json: |
    {
     "id": "kcwf01intake0001",
     "name": "WF-01 intake (Slack 이벤트)",
     "active": true,
     "nodes": [
      {
       "id": "bb99ef93-81ab-5268-a390-28b937cb9047",
       "name": "Slack 이벤트",
       "type": "n8n-nodes-base.webhook",
       "typeVersion": 2,
       "position": [
        0,
        300
       ],
       "parameters": {
        "httpMethod": "POST",
        "path": "chat",
        "authentication": "headerAuth",
        "responseMode": "onReceived",
        "options": {}
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kchookchat000001",
         "name": "webhook: chat-gateway"
        }
       },
       "webhookId": "079724a1-cc5c-5cb1-92a3-099c891b4953"
      },
      {
       "id": "5b3352d5-a41c-5d1b-92c4-446bcaf8c404",
       "name": "준비",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        220,
        300
       ],
       "parameters": {
        "jsCode": "// chat-gateway 가 보낸 공통 이벤트 JSON (body). 권한을 확인하고 다음 단계를 정한다.\nconst ROLES = {\"U0B330BGTJA\": \"operator\"};\nconst ev = $json.body ?? {};\nconst role = ROLES[ev.user_id] ?? 'none';\nlet mode = 'route', reply = '';\nif (role === 'none') {\n  mode = 'reply';\n  reply = `권한이 없습니다. 운영자에게 사용자 ID \\`${ev.user_id}\\` 등록을 요청하세요.`;\n} else if (ev.type === 'button_click' && String(ev.action?.id ?? '').startsWith('mlops_')) {\n  mode = 'mlops';  // 재학습·승격 버튼 → WF-04 (역할 확인은 WF-04 가 한다)\n} else if (ev.type === 'button_click' && String(ev.action?.id ?? '').startsWith('sec_')) {\n  mode = 'security';  // 보안 조치 버튼 → WF-03 (역할 확인은 WF-03 가 한다)\n} else if (ev.type === 'button_click') {\n  mode = 'reply';\n  reply = '승인 버튼 처리는 아직 준비 중입니다.';\n} else if (!(ev.text ?? '').trim()) {\n  mode = 'reply';\n  reply = '무엇을 도와드릴까요? 예: \"주문 조회가 느려졌어요, 원인 확인해줘\"';\n}\nreturn [{ json: { ...ev, role, mode, reply, started_at: Date.now() } }];"
       }
      },
      {
       "id": "f2aaa4ff-2d36-52b8-b773-b93d99f6da23",
       "name": "분류 필요?",
       "type": "n8n-nodes-base.if",
       "typeVersion": 2.2,
       "position": [
        440,
        300
       ],
       "parameters": {
        "conditions": {
         "options": {
          "caseSensitive": true,
          "leftValue": "",
          "typeValidation": "loose",
          "version": 2
         },
         "conditions": [
          {
           "id": "b3e1615b-1e66-50e6-8a17-6c72a57741d6",
           "leftValue": "={{ $json.mode === 'route' }}",
           "rightValue": "",
