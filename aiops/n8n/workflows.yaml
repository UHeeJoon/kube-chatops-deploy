  wf-02-investigate.json: |
    {
     "id": "kcwf02investig01",
     "name": "WF-02 investigate (조사와 보고)",
     "active": true,
     "nodes": [
      {
       "id": "1789572e-78be-548d-9c90-15ad82ac1b6b",
       "name": "WF-01 에서 호출",
       "type": "n8n-nodes-base.executeWorkflowTrigger",
       "typeVersion": 1.1,
       "position": [
        0,
        100
       ],
       "parameters": {
        "inputSource": "passthrough"
       }
      },
      {
       "id": "1fb4d81f-3acc-525e-a9f3-3af8b7f7b2b5",
       "name": "Alertmanager",
       "type": "n8n-nodes-base.webhook",
       "typeVersion": 2,
       "position": [
        0,
        400
       ],
       "parameters": {
        "httpMethod": "POST",
        "path": "alert",
        "authentication": "headerAuth",
        "responseMode": "onReceived",
        "options": {}
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kchookalert00001",
         "name": "webhook: alertmanager"
        }
       },
       "webhookId": "a38d5324-ad15-52ca-a653-d34ad849802f"
      },
      {
       "id": "b260a549-11a1-5267-9a23-cca77aea7294",
       "name": "알림 정리",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        220,
        400
       ],
       "parameters": {
        "jsCode": "// Alertmanager webhook (그룹 하나 = 요청 하나). firing 알림만 조사한다.\nconst g = $json.body ?? {};\nconst firing = (g.alerts ?? []).filter(a => a.status === 'firing');\nif (!firing.length) return [];\nconst a = firing[0];\nconst name = a.labels?.alertname ?? 'alert';\nconst summary = a.annotations?.summary ?? '';\nconst kst = t => new Date(t).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });\n// 알림이 하나면 한 줄, 여러 개면 대상별 목록\nconst head = `:rotating_light: *${name}* · ${summary}`;\nconst more = firing.length > 1\n  ? '\\n' + firing.slice(0, 5).map(x => `• ${x.labels?.pod ?? x.labels?.service ?? x.labels?.namespace ?? ''} ${x.annotations?.summary ?? ''}`.trim()).join('\\n')\n  : '';\nconst meta = `\\n_${a.labels?.namespace ?? ''} · ${a.labels?.severity ?? ''} · ${kst(a.startsAt)} 시작 · 이 스레드에 자동 조사 결과가 달립니다_`;\n// 선 조치: auto_action=quarantine 알림이면 가장 최근에 시작된 대상 파드 하나를 격리한다 (demo 만)\nconst target = firing.filter(x => x.labels?.auto_action === 'quarantine' && x.labels?.pod && x.labels?.namespace === 'demo')\n  .sort((x, y) => String(y.startsAt).localeCompare(String(x.startsAt)))[0];\nreturn [{ json: {\n  quarantine: target ? { namespace: target.labels.namespace, pod: target.labels.pod, reason: name } : null,\n  title: head + more + meta,\n  question: `알림 '${name}' 이(가) 발생했다. ${summary} 원인을 조사해줘.`,\n  alert: { status: g.status, commonLabels: g.commonLabels, commonAnnotations: g.commonAnnotations,\n           alerts: firing.slice(0, 5).map(x => ({ labels: x.labels, annotations: x.annotations, startsAt: x.startsAt })) },\n} }];"
       }
      },
      {
       "id": "c5290aeb-9ad5-5619-8a5c-fde5a9c992c6",
       "name": "격리 대상?",
       "type": "n8n-nodes-base.if",
       "typeVersion": 2.2,
       "position": [
        220,
        600
