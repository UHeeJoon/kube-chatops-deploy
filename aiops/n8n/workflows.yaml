      {
       "id": "03c96654-1b90-5d68-bba8-19d420067e74",
       "name": "의도 분류",
       "type": "n8n-nodes-base.httpRequest",
       "typeVersion": 4.2,
       "position": [
        660,
        200
       ],
       "parameters": {
        "method": "POST",
        "url": "http://agent.aiops.svc:8080/route",
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth",
        "sendBody": true,
        "specifyBody": "json",
        "jsonBody": "={{ JSON.stringify({ text: $json.text }) }}",
        "options": {
         "timeout": 30000,
         "response": {
          "response": {
           "fullResponse": true,
           "neverError": true
          }
         }
        }
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kcagentapi000001",
         "name": "agent API"
        }
       }
      },
      {
       "id": "961e91c6-a6c6-58ad-b511-e780c484bfb9",
       "name": "다음 단계",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        880,
        200
       ],
       "parameters": {
        "jsCode": "// /route 결과로 다음 단계를 정한다. investigate → 조사 보고서, query → 짧은 답(answer 모드). 나머지는 바로 답장.\nconst ev = $('준비').item.json;\nconst res = $json;\nlet next = 'reply', reply = '', intent = 'error', mode = 'investigate';\nif (res.statusCode === 200) {\n  intent = res.body.intent;\n  if (intent === 'investigate' || intent === 'query') next = 'investigate';\n  if (intent === 'query') mode = 'answer';\n  else if (intent === 'mlops') next = 'mlops';\n  else if (intent === 'action_request') reply = '조치 실행은 조사 보고서의 승인 버튼으로만 할 수 있습니다 (승인 흐름 준비 중). 먼저 무엇이 문제인지 물어봐 주세요.';\n  else reply = res.body.reply || '네.';\n} else if (res.statusCode === 429) {\n  reply = '오늘 AI 사용 예산을 다 썼습니다. 내일 다시 시도해 주세요.';\n} else {\n  reply = `요청을 처리하지 못했습니다 (agent ${res.statusCode ?? '연결 실패'}).`;\n}\nreturn [{ json: { ...ev, intent, next, reply, mode, question: ev.text, route_cost: res.body?.usage?.cost_usd ?? 0 } }];"
       }
      },
      {
