  wf-04-mlops.json: |
    {
     "id": "kcwf04mlops00001",
     "name": "WF-04 mlops (재학습과 승격)",
     "active": true,
     "nodes": [
      {
       "id": "02690833-0d51-5093-b834-dd3886041077",
       "name": "학습 결과",
       "type": "n8n-nodes-base.webhook",
       "typeVersion": 2,
       "position": [
        0,
        0
       ],
       "parameters": {
