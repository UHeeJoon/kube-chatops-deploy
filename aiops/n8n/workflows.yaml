      {
       "id": "03c96654-1b90-5d68-bba8-19d420067e74",
       "name": "의도 분류",
       "type": "n8n-nodes-base.httpRequest",
       "typeVersion": 4.2,
       "position": [
        660,
        200
       ],
       "parameters": {
        "method": "POST",
        "url": "http://agent.aiops.svc:8080/route",
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth",
        "sendBody": true,
        "specifyBody": "json",
        "jsonBody": "={{ JSON.stringify({ text: $json.text }) }}",
        "options": {
         "timeout": 30000,
         "response": {
          "response": {
           "fullResponse": true,
           "neverError": true
          }
         }
        }
       },
