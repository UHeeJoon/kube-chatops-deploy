      {
       "id": "09bbe324-a16a-525e-8396-8dc253777016",
       "name": "요청 정리",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        220,
        300
       ],
       "parameters": {
        "jsCode": "const DEPLOYS = ['demo-app'];\nconst MAX_AGE_MIN = 60;\nconst ev = $json;\nconst id = ev.action?.id ?? '';\nconst [namespace, name] = String(ev.action?.value ?? '').split('/');\nlet op = id === 'sec_delete_pod' ? 'delete_pod' : ['act_restart', 'act_rollback', 'act_scale'].includes(id) ? id.slice(4) : 'unknown', note = '';\nif (ev.role !== 'operator') { op = 'deny'; note = '조치 버튼은 operator 만 누를 수 있습니다.'; }\nelse if (op === 'unknown') note = `모르는 조치입니다 (${id}).`;\nelse if (op === 'delete_pod' && (namespace !== 'demo' || !/^[a-z0-9.-]{1,253}$/.test(name ?? ''))) { op = 'deny'; note = '대상이 올바르지 않습니다.'; }\nelse if (op !== 'delete_pod' && (namespace !== 'demo' || !DEPLOYS.includes(name))) { op = 'deny'; note = `조치할 수 없는 대상입니다 (허용: ${DEPLOYS.map(d => 'demo/' + d).join(', ')}).`; }\n// 오래된 보고서의 버튼은 받지 않는다. 그 사이 상태가 바뀌었을 수 있다 (이미 되돌린 뒤 롤백을 또 누르면 되돌림이 취소된다).\nelse if (op !== 'delete_pod' && !(Date.now() / 1000 - Number(ev.message_ts) < MAX_AGE_MIN * 60)) { op = 'deny'; note = `이 보고서는 ${MAX_AGE_MIN}분이 넘었습니다. 지금 상태가 달라졌을 수 있으니 다시 조사한 뒤 새 보고서에서 승인하세요.`; }\nreturn [{ json: { ...ev, op, namespace, pod: op === 'delete_pod' ? name : null, deploy: op !== 'delete_pod' && op !== 'deny' && op !== 'unknown' ? name : null, note } }];"
       }
