# 생성 파일: scripts/gen-n8n-workflows.py 로 다시 만든다. 직접 고치지 말 것.
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-workflows
  namespace: aiops
  labels: { app.kubernetes.io/name: n8n }
data:
  wf-01-intake.json: |
    {
     "id": "kcwf01intake0001",
     "name": "WF-01 intake (Slack 이벤트)",
     "active": true,
     "nodes": [
      {
       "id": "bb99ef93-81ab-5268-a390-28b937cb9047",
       "name": "Slack 이벤트",
       "type": "n8n-nodes-base.webhook",
       "typeVersion": 2,
       "position": [
        0,
        300
       ],
       "parameters": {
        "httpMethod": "POST",
        "path": "chat",
        "authentication": "headerAuth",
        "responseMode": "onReceived",
        "options": {}
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kchookchat000001",
         "name": "webhook: chat-gateway"
        }
       },
       "webhookId": "079724a1-cc5c-5cb1-92a3-099c891b4953"
      },
      {
       "id": "5b3352d5-a41c-5d1b-92c4-446bcaf8c404",
       "name": "준비",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        220,
        300
       ],
       "parameters": {
        "jsCode": "// chat-gateway 가 보낸 공통 이벤트 JSON (body). 권한을 확인하고 다음 단계를 정한다.\nconst ROLES = {\"U0B330BGTJA\": \"operator\"};\nconst ev = $json.body ?? {};\nconst role = ROLES[ev.user_id] ?? 'none';\nlet mode = 'route', reply = '';\nif (role === 'none') {\n  mode = 'reply';\n  reply = `권한이 없습니다. 운영자에게 사용자 ID \\`${ev.user_id}\\` 등록을 요청하세요.`;\n} else if (ev.type === 'button_click' && String(ev.action?.id ?? '').startsWith('mlops_')) {\n  mode = 'mlops';  // 재학습·승격 버튼 → WF-04 (역할 확인은 WF-04 가 한다)\n} else if (ev.type === 'button_click' && /^(sec|act)_/.test(String(ev.action?.id ?? ''))) {\n  mode = 'security';  // 조치 버튼(격리 파드 삭제, 재시작·롤백·증설 승인) → WF-03 (역할 확인은 WF-03 가 한다)\n} else if (ev.type === 'button_click') {\n  mode = 'reply';\n  reply = '승인 버튼 처리는 아직 준비 중입니다.';\n} else if ((t => t.length <= 20 && /^(사건|보고서|incidents?)(\\s|$)/i.test(t) && (/목록|기록|list|\\d/i.test(t) || /^\\S+$/.test(t)))((ev.text ?? '').trim())) {\n  // \"사건 목록\", \"사건 목록 조회\", \"사건 12 보여줘\" 처럼 뒤에 말이 붙거나 오타가 있어도 조회로 본다 (짧은 글만)\n  mode = 'incident';  // 사건 기록 조회 (agent DB, LLM 을 부르지 않는다)\n} else if (!(ev.text ?? '').trim()) {\n  mode = 'reply';\n  reply = '무엇을 도와드릴까요? 예: \"주문 조회가 느려졌어요, 원인 확인해줘\"';\n}\nreturn [{ json: { ...ev, role, mode, reply, started_at: Date.now() } }];"
       }
      },
      {
       "id": "f2aaa4ff-2d36-52b8-b773-b93d99f6da23",
       "name": "분류 필요?",
       "type": "n8n-nodes-base.if",
       "typeVersion": 2.2,
       "position": [
        440,
        300
       ],
       "parameters": {
        "conditions": {
         "options": {
          "caseSensitive": true,
          "leftValue": "",
          "typeValidation": "loose",
          "version": 2
         },
         "conditions": [
          {
           "id": "b3e1615b-1e66-50e6-8a17-6c72a57741d6",
           "leftValue": "={{ $json.mode === 'route' }}",
           "rightValue": "",
           "operator": {
            "type": "boolean",
            "operation": "true",
            "singleValue": true
           }
          }
         ],
         "combinator": "and"
        },
        "options": {}
       }
      },
      {
       "id": "e6c999ad-2702-5e9f-b9af-5c2977ca4e69",
       "name": "사건 조회?",
       "type": "n8n-nodes-base.if",
       "typeVersion": 2.2,
       "position": [
        660,
        800
       ],
       "parameters": {
        "conditions": {
         "options": {
          "caseSensitive": true,
          "leftValue": "",
          "typeValidation": "loose",
          "version": 2
         },
         "conditions": [
          {
           "id": "398c800c-87f6-5d1c-a034-d64a3c5a4c62",
           "leftValue": "={{ $json.mode === 'incident' }}",
           "rightValue": "",
           "operator": {
            "type": "boolean",
            "operation": "true",
            "singleValue": true
           }
          }
         ],
         "combinator": "and"
        },
        "options": {}
       }
      },
      {
       "id": "5b8923c7-aee9-5bfe-974b-c69759ed2619",
       "name": "사건 기록",
       "type": "n8n-nodes-base.httpRequest",
       "typeVersion": 4.2,
       "position": [
        880,
        800
       ],
       "parameters": {
        "method": "GET",
        "url": "={{ (() => { const m = String($json.text ?? '').match(/\\d+/); return 'http://agent.aiops.svc:8080/incidents' + (m ? '/' + m[0] : '?limit=10'); })() }}",
        "authentication": "genericCredentialType",
        "genericAuthType": "httpHeaderAuth",
        "options": {
         "timeout": 30000,
         "response": {
          "response": {
           "fullResponse": true,
           "neverError": true
          }
         }
        }
       },
       "credentials": {
        "httpHeaderAuth": {
         "id": "kcagentapi000001",
         "name": "agent API"
        }
       }
      },
      {
       "id": "08cd9b21-a31b-51d1-9af4-794931762bdf",
       "name": "사건 답장",
       "type": "n8n-nodes-base.code",
       "typeVersion": 2,
       "position": [
        1100,
        800
       ],
       "parameters": {
        "jsCode": "// 사건 목록 또는 사건 하나(마크다운)를 Slack 글로\nconst ev = $('준비').item.json;\nconst res = $json;\nconst kst = t => new Date(t).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });\nconst toSlack = t => String(t ?? '').replace(/\\*\\*(.+?)\\*\\*/g, '*$1*').replace(/^#{1,6}\\s*(.+)$/gm, '*$1*').replace(/^\\s*- /gm, '• ');\nlet reply;\nif (res.statusCode === 404) reply = '그 번호의 사건이 없습니다. `사건 목록` 으로 번호를 확인하세요.';\nelse if (res.statusCode !== 200) reply = `사건 기록을 읽지 못했습니다 (agent ${res.statusCode ?? '연결 실패'}).`;\nelse if (res.body.markdown) {\n  const md = toSlack(res.body.markdown);\n  reply = md.length > 3800 ? md.slice(0, 3800) + '\\n…(길어서 줄임)' : md;\n} else {\n  const sev = { critical: ':red_circle:', warning: ':large_yellow_circle:', ok: ':large_green_circle:' };\n  const rows = (res.body.incidents ?? []).map(i =>\n    `${sev[i.severity] ?? ':white_circle:'} *#${i.id}* ${kst(i.opened_at)} · \\`${i.namespace}\\` · ${String(i.title).slice(0, 80)}\\n      ◦ ${(i.alert_names ?? []).join(', ') || 'Slack 질문'} · 조사 ${i.report_count}회 · $${Number(i.cost_usd).toFixed(2)}`);\n  reply = rows.length ? `*최근 사건* (자세히: \\`사건 번호\\`)\\n${rows.join('\\n')}` : '기록된 사건이 없습니다.';\n}\nreturn [{ json: { ...ev, reply, intent: 'incident' } }];"
       }
      },
