# WF-04 가 Slack 재학습 버튼으로 mlops 에 Workflow 를 만들 때 쓰는 신원.
# 권한은 mlops/pipeline/rbac.yaml (Workflow create 만). n8n 파드에는 토큰을 마운트하지 않고(automount 꺼짐),
# 아래 Secret 의 토큰을 init 컨테이너가 n8n 자격 증명으로 넣는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-mlops
  namespace: aiops
automountServiceAccountToken: false
---
# 만료 없는 토큰. 교체하려면 이 Secret 을 지우면 Argo CD 가 다시 만들고 새 토큰이 채워진다 (n8n 재시작 필요).
apiVersion: v1
kind: Secret
metadata:
  name: n8n-mlops-token
  namespace: aiops
  annotations:
    kubernetes.io/service-account.name: n8n-mlops
type: kubernetes.io/service-account-token
