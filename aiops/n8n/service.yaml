apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: aiops
  labels: { app.kubernetes.io/name: n8n }
spec:
  selector: { app.kubernetes.io/name: n8n }
  ports:
    - { name: http, port: 5678, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: aiops
spec:
  parentRefs:
    - { name: admin-gateway, namespace: ingress }
  hostnames: [n8n.ascode.click]
  rules:
    # webhook 은 클러스터 안(chat-gateway, Alertmanager)에서만 부른다. Gateway 로 들어온 webhook 요청은 첫 화면으로 돌린다.
    - matches:
        - path: { type: PathPrefix, value: /webhook }
        - path: { type: PathPrefix, value: /webhook-test }
        - path: { type: PathPrefix, value: /webhook-waiting }
      filters:
        - type: RequestRedirect
          requestRedirect: { path: { type: ReplaceFullPath, replaceFullPath: / }, statusCode: 302 }
    - backendRefs:
        - { name: n8n, port: 5678 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: n8n
  namespace: aiops
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: n8n }
  endpoints:
    - { port: http, path: /metrics, interval: 30s }
