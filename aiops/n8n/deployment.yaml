# n8n: 승인 흐름과 실행(감사 로그 포함)을 맡는다. 상태는 aiops-pg 의 n8n DB 에 둔다.
# 인스턴스 1개 (queue 모드 아님) → Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: aiops
  labels: { app.kubernetes.io/name: n8n, app.kubernetes.io/part-of: kube-chatops }
spec:
  replicas: 1
  strategy: { type: Recreate }
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: n8n }
  template:
    metadata:
      labels: { app.kubernetes.io/name: n8n, app.kubernetes.io/part-of: kube-chatops }
      annotations:
        kube-chatops/workflows-sha: e1cd4c507983f048
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false # Service 이름이 n8n 이라 N8N_PORT=tcp://... 환경 변수가 생겨 n8n 설정과 충돌한다
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # 워크플로와 자격 증명을 Git(ConfigMap)과 Secret 에서 넣는다. 화면에서 고친 것은 재시작하면 Git 내용으로 덮인다.
      # - 자격 증명: Secret 의 토큰으로 HTTP 헤더 인증 4개를 만든다 (ID 고정 → 다시 넣으면 덮어씀). 토큰은 이 컨테이너에만 env 로 준다.
      # - 워크플로: JSON 의 active 값대로 활성화한다.
      initContainers:
        - name: import
          image: docker.io/n8nio/n8n:2.49.6@sha256:a1a9955a4a9e5dd9fa65a62f59e0751351b45b9e5cd2c17e6e330a8d0026cad8
          command: [sh, -ec]
          args:
            - |
              node -e '
                const c = [
                  ["kcagentapi000001", "agent API", "AGENT_API_TOKEN"],
                  ["kcgatewayapi0001", "chat-gateway API", "GATEWAY_API_TOKEN"],
                  ["kchookchat000001", "webhook: chat-gateway", "CHAT_WEBHOOK_TOKEN"],
                  ["kchookalert00001", "webhook: alertmanager", "ALERT_WEBHOOK_TOKEN"],
                ];
                // 토큰이 아직 없으면(예: Vault 에 알림 토큰 미등록) 무작위 값으로 만든다.
                // 워크플로는 정상 게시되고, 그 webhook 은 진짜 토큰이 들어올 때까지 모든 요청을 거절한다.
                const rnd = () => require("crypto").randomBytes(32).toString("hex");
                const out = c.map(([id, name, e]) => {
                  if (!process.env[e]) console.log("토큰 없음, 임시 값 사용:", name);
                  return { id, name, type: "httpHeaderAuth", data: { name: "Authorization", value: "Bearer " + (process.env[e] || rnd()) } };
                });
                require("fs").writeFileSync("/import/credentials.json", JSON.stringify(out));
                console.log("credentials:", out.map(x => x.name).join(", "));
              '
              n8n import:credentials --input=/import/credentials.json
              rm -f /import/credentials.json
              n8n import:workflow --separate --input=/workflows
              # 단일 인스턴스 모드에서는 import 가 활성화를 못 한다 → JSON 에 active: true 인 것만 게시(publish).
              # 하위 워크플로가 먼저 게시돼 있어야 해서 번호 역순(99 → 02 → 01)으로 한다
              for f in $(ls /workflows/*.json | sort -r); do
                id=$(node -e 'const w = require(process.argv[1]); if (w.active) console.log(w.id)' "$f")
                # 게시가 실패해도 n8n 본체는 뜨게 한다 (화면과 기존 워크플로는 살아 있어야 함). 실패는 이 로그에 남는다
                [ -n "$id" ] && { n8n publish:workflow --id="$id" || echo "경고: $id 게시 실패"; }
              done
          env:
            - { name: DB_TYPE, value: postgresdb }
            - { name: DB_POSTGRESDB_HOST, value: aiops-pg-rw.aiops.svc }
            - { name: DB_POSTGRESDB_PORT, value: "5432" }
            - { name: DB_POSTGRESDB_DATABASE, value: n8n }
            - name: DB_POSTGRESDB_USER
              valueFrom: { secretKeyRef: { name: aiops-pg-n8n, key: username } }
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom: { secretKeyRef: { name: aiops-pg-n8n, key: password } }
            - name: N8N_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: n8n, key: encryption_key } }
            - name: AGENT_API_TOKEN
              valueFrom: { secretKeyRef: { name: agent, key: API_TOKEN } }
            - name: GATEWAY_API_TOKEN
              valueFrom: { secretKeyRef: { name: chat-gateway-api, key: token } }
            - name: CHAT_WEBHOOK_TOKEN
              valueFrom: { secretKeyRef: { name: chat-n8n-webhook, key: token } }
            - name: ALERT_WEBHOOK_TOKEN # Vault 에 값이 없으면 이 자격 증명만 빠진다 (알림 webhook 이 인증에 실패)
              valueFrom: { secretKeyRef: { name: n8n-alert-webhook, key: token, optional: true } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: home, mountPath: /home/node }
            - { name: tmp, mountPath: /tmp }
            - { name: import, mountPath: /import }
            - { name: workflows, mountPath: /workflows, readOnly: true }
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.49.6@sha256:a1a9955a4a9e5dd9fa65a62f59e0751351b45b9e5cd2c17e6e330a8d0026cad8
          ports:
            - { name: http, containerPort: 5678 }
          env:
            - { name: DB_TYPE, value: postgresdb }
            - { name: DB_POSTGRESDB_HOST, value: aiops-pg-rw.aiops.svc }
            - { name: DB_POSTGRESDB_PORT, value: "5432" }
            - { name: DB_POSTGRESDB_DATABASE, value: n8n }
            - name: DB_POSTGRESDB_USER
              valueFrom: { secretKeyRef: { name: aiops-pg-n8n, key: username } }
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom: { secretKeyRef: { name: aiops-pg-n8n, key: password } }
            - name: N8N_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: n8n, key: encryption_key } }
            - { name: N8N_HOST, value: n8n.ascode.click }
            - { name: N8N_PROTOCOL, value: http }
            - { name: WEBHOOK_URL, value: "http://n8n.ascode.click/" }
            - { name: N8N_PROXY_HOPS, value: "1" }
            - { name: N8N_SECURE_COOKIE, value: "false" } # admin-gateway 가 HTTP 라서. TLS 붙이면 지운다
            - { name: GENERIC_TIMEZONE, value: Asia/Seoul }
            - { name: TZ, value: Asia/Seoul }
            - { name: N8N_METRICS, value: "true" }
            - { name: N8N_DIAGNOSTICS_ENABLED, value: "false" }
            - { name: N8N_VERSION_NOTIFICATIONS_ENABLED, value: "false" }
            - { name: N8N_PERSONALIZATION_ENABLED, value: "false" }
            - { name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS, value: "true" }
            - { name: EXECUTIONS_DATA_PRUNE, value: "true" }
            - { name: EXECUTIONS_DATA_MAX_AGE, value: "336" } # 14일
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: home, mountPath: /home/node } # .n8n, .cache (정적 파일 생성) 모두 여기
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: home, emptyDir: { sizeLimit: 256Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - { name: import, emptyDir: { medium: Memory, sizeLimit: 1Mi } } # 자격 증명 파일. import 후 지운다
        - name: workflows
          configMap: { name: n8n-workflows }
