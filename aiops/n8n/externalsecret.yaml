# Vault secret/kube-chatops/n8n → Secret n8n. 테넌트 전용 SecretStore vault 를 쓴다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: n8n
    creationPolicy: Owner
  data:
    - secretKey: encryption_key
      remoteRef: { key: kube-chatops/n8n, property: encryption_key }
---
# Alertmanager → n8n webhook 토큰 (demo ns 의 같은 이름 ExternalSecret 과 같은 Vault 값).
# 따로 둔 이유: Vault 에 값이 아직 없을 때 encryption_key 동기화까지 같이 실패하지 않게.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-alert-webhook
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: n8n-alert-webhook, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: kube-chatops/n8n, property: alert_webhook_token }
---
# WF-04: 학습 파이프라인(mlops) → n8n webhook 토큰. mlops 의 mlops-n8n-webhook 과 같은 Vault 값.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-mlops-webhook
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: n8n-mlops-webhook, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: kube-chatops/mlops, property: n8n_webhook_token }
---
# WF-04: 모델 승격 커밋용 GitHub 토큰. fine-grained PAT, 저장소 kube-chatops-deploy 하나, Contents 읽기·쓰기만.
# 따로 둔 이유: 토큰이 없어도 다른 자격 증명 동기화는 계속되게.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-github
  namespace: aiops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: n8n-github, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: kube-chatops/mlops, property: github_token }
