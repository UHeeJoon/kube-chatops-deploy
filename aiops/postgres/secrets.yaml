# DB 계정 비밀번호는 클러스터 안에서 한 번 생성한다 (Git, Vault 에 두지 않음).
# refreshInterval 0 = 처음 한 번만 생성. ExternalSecret 을 지우고 다시 만들면 새 비밀번호가 나오고
# CNPG 가 managed role 비밀번호를 그 값으로 바꾸므로 앱과 DB 가 계속 맞는다.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: { name: db-password, namespace: aiops }
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: aiops-pg-n8n, namespace: aiops }
spec:
  refreshInterval: "0"
  target:
    name: aiops-pg-n8n
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" } # 비밀번호가 바뀌면 CNPG 가 role 에 바로 반영
      data:
        username: n8n
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: db-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: aiops-pg-agent, namespace: aiops }
spec:
  refreshInterval: "0"
  target:
    name: aiops-pg-agent
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" } # 비밀번호가 바뀌면 CNPG 가 role 에 바로 반영
      data:
        username: agent
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: db-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: aiops-pg-rag, namespace: aiops }
spec:
  refreshInterval: "0"
  target:
    name: aiops-pg-rag
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" } # 비밀번호가 바뀌면 CNPG 가 role 에 바로 반영
      data:
        username: rag
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: db-password }
---
# MLflow 는 다른 네임스페이스(mlops)에서 접속해서, 비밀번호를 클러스터 안에서 만들지 않고 Vault 에서 둘이 같이 읽는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: aiops-pg-mlflow, namespace: aiops }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: aiops-pg-mlflow
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" } # 비밀번호가 바뀌면 CNPG 가 role 에 바로 반영
      data:
        username: mlflow
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: kube-chatops/mlops, property: mlflow_db_password } }
