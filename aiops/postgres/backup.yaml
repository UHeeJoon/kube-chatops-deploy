# aiops-pg 논리 백업 (11-28 전체 검토: 인스턴스 1개에 백업이 없었다).
# 이 DB 하나에 대화 상태·사건 기록(agent), 워크플로와 실행 기록(n8n), 검색 색인(rag), 모델 레지스트리(mlflow)가 있다.
#
# 매일 04:10 에 DB 마다 pg_dump (custom 형식) → 별도 볼륨 /backup/<날짜>/<db>.dump, 7일 보관.
#   - DB 볼륨은 복제 1개(longhorn-single, kube-worker)다. 백업 볼륨은 복제 2개(longhorn-prod, Retain)라 두 노드에 있다:
#     DB 가 있는 노드의 디스크를 잃어도 백업은 남고, PVC 를 지워도 볼륨은 남는다.
#   - 지키는 것: 잘못된 삭제·마이그레이션, DB 손상, 노드 하나의 디스크 손실.
#   - 지키지 못하는 것: 클러스터 전체 손실 (같은 클러스터 안의 볼륨이다), 마지막 덤프 이후의 변경 (최대 하루).
#     더 가려면 MinIO 등 바깥 저장소로 CNPG barman 백업(WAL 보관, 시점 복구)을 붙인다. 접근 키가 필요해 여기서는 하지 않았다.
#   - 비밀번호는 CNPG 가 쓰는 역할별 Secret 을 그대로 참조한다 (새 자격 증명을 만들지 않는다). 각 역할은 자기 DB 의 주인이라 덤프할 수 있다.
#
# 복구 (예: agent DB 를 그날 상태로):
#   kubectl -n aiops create job --from=cronjob/aiops-pg-dump restore-shell   # 또는 볼륨을 붙인 임시 파드
#   pg_restore -h aiops-pg-rw -U agent -d agent --clean --if-exists /backup/2026-11-28/agent.dump
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiops-pg-dump
  namespace: aiops
  labels: { app.kubernetes.io/name: aiops-pg-dump, app.kubernetes.io/part-of: kube-chatops }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-prod
  resources:
    requests: { storage: 5Gi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-pg-dump
  namespace: aiops
  labels: { app.kubernetes.io/name: aiops-pg-dump, app.kubernetes.io/part-of: kube-chatops }
spec:
  schedule: "10 4 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app.kubernetes.io/name: aiops-pg-dump, app.kubernetes.io/part-of: kube-chatops }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: dump
              # DB 와 같은 이미지 (pg_dump 판이 서버와 같아야 한다)
              image: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
              command: ["/bin/bash", "-euo", "pipefail", "-c"]
              args:
                - |
                  day=$(date +%F)
                  dir=/backup/$day
                  mkdir -p "$dir"
                  for db in n8n agent rag mlflow; do
                    var="PW_${db}"
                    echo "dump $db"
                    PGPASSWORD="${!var}" pg_dump -h aiops-pg-rw.aiops.svc -U "$db" -d "$db" -Fc --no-owner -f "$dir/$db.dump.tmp"
                    # 읽을 수 있는 덤프인지 목차로 확인한 뒤에 이름을 바꾼다 (쓰다 만 파일이 백업으로 남지 않게)
                    pg_restore --list "$dir/$db.dump.tmp" > /dev/null
                    mv "$dir/$db.dump.tmp" "$dir/$db.dump"
                  done
                  # 7일 넘은 날짜 폴더를 지운다 (YYYY-MM-DD 꼴의 폴더만)
                  find /backup -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}' -mtime +7 -exec rm -rf {} +
                  du -sh /backup/* | tail -8
              env:
                - { name: PW_n8n, valueFrom: { secretKeyRef: { name: aiops-pg-n8n, key: password } } }
                - { name: PW_agent, valueFrom: { secretKeyRef: { name: aiops-pg-agent, key: password } } }
                - { name: PW_rag, valueFrom: { secretKeyRef: { name: aiops-pg-rag, key: password } } }
                - { name: PW_mlflow, valueFrom: { secretKeyRef: { name: aiops-pg-mlflow, key: password } } }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: aiops-pg-dump }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
---
# default-deny 네임스페이스라 나가는 길을 따로 연다: DB 와 DNS 만
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: aiops-pg-dump, namespace: aiops }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: aiops-pg-dump }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: aiops-pg }
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiops-pg-backup
  namespace: aiops
  labels:
    release: kube-prometheus
spec:
  groups:
    - name: aiops-pg-backup
      rules:
        - alert: AiopsDatabaseBackupStale
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="aiops", cronjob="aiops-pg-dump"}) > 129600
            or (absent(kube_cronjob_status_last_successful_time{namespace="aiops", cronjob="aiops-pg-dump"})
                and on() (time() - max(kube_cronjob_created{namespace="aiops", cronjob="aiops-pg-dump"}) > 129600))
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: 'aiops-pg 백업이 36시간 넘게 성공하지 못함'
            description: '대화 상태·사건·n8n·검색 색인·모델 레지스트리가 이 DB 하나에 있다. kubectl -n aiops get job -l app.kubernetes.io/name=aiops-pg-dump 와 그 파드 로그를 본다.'
