# aiops 전용 PostgreSQL (CNPG). n8n, 에이전트 체크포인트, RAG(pgvector) 가 같이 쓴다.
# 이미지 18.3-system-trixie 에 pgvector 가 들어 있다.
# 인스턴스 1개 + longhorn-single: 노드 간 네트워크가 WiFi 라 복제를 줄인다. 백업은 MinIO 연동 후 추가.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aiops-pg
  namespace: aiops
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  storage:
    size: 10Gi
    storageClass: longhorn-single
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "100"
  bootstrap:
    initdb:
      database: postgres_init
      owner: postgres_init
  managed:
    roles:
      - { name: n8n, ensure: present, login: true, passwordSecret: { name: aiops-pg-n8n } }
      - { name: agent, ensure: present, login: true, passwordSecret: { name: aiops-pg-agent } }
      - { name: rag, ensure: present, login: true, passwordSecret: { name: aiops-pg-rag } }
