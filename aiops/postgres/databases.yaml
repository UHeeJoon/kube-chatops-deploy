apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata: { name: n8n, namespace: aiops }
spec:
  cluster: { name: aiops-pg }
  name: n8n
  owner: n8n
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata: { name: agent, namespace: aiops }
spec:
  cluster: { name: aiops-pg }
  name: agent
  owner: agent
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata: { name: rag, namespace: aiops }
spec:
  cluster: { name: aiops-pg }
  name: rag
  owner: rag
  extensions:
    - { name: vector, ensure: present }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata: { name: mlflow, namespace: aiops }
spec:
  cluster: { name: aiops-pg }
  name: mlflow
  owner: mlflow
