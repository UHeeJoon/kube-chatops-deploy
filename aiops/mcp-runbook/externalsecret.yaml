# 에이전트 → mcp-runbook 인증 토큰. 클러스터 안에서 한 번 생성한다 (Git, Vault 에 두지 않음).
# 둘이 같은 네임스페이스라 같은 Secret 을 읽는다 (agent 의 MCP_TOKEN_RUNBOOK).
# 바꾸려면 ExternalSecret 을 지우고 다시 만든다. Reloader 가 두 Deployment 를 재시작한다.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: { name: mcp-runbook-token, namespace: aiops }
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: mcp-runbook, namespace: aiops }
spec:
  refreshInterval: "0"
  target:
    name: mcp-runbook
    template:
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: mcp-runbook-token }
