# Vault secret/kube-chatops/mcp 의 k8s 키 → Secret mcp-k8s (token). agent 도 같은 값을 읽는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-k8s
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: mcp-k8s
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: kube-chatops/mcp, property: k8s }
