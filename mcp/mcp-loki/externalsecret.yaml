# Vault secret/kube-chatops/mcp 의 loki 키 → Secret mcp-loki (token). agent 도 같은 값을 읽는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-loki
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: mcp-loki
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: kube-chatops/mcp, property: loki }
