# mcp-loki
# 들어옴: aiops ns(agent) 의 8080 만. 메트릭 스크레이프(monitoring) 는 테넌트 기준선 platform-baseline 이 허용.
# 나감: Loki(monitoring:3100) 만. DNS 는 기준선이 허용.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mcp-loki, namespace: mcp }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mcp-loki }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aiops }
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: loki }
      ports:
        - { port: 3100, protocol: TCP }
