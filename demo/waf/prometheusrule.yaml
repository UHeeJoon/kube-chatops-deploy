# WAF 차단 알림. 차단(403)은 이미 끝난 조치라 알림은 보고용이다 (n8n → 에이전트 조사 → Slack).
# 어떤 IP·규칙인지는 Loki {namespace="demo", container="waf"} 의 "WAF rule violation detected" 줄에 있다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: waf
  namespace: demo
  labels: { release: kube-prometheus, app.kubernetes.io/part-of: kube-chatops }
spec:
  groups:
    - name: demo-waf
      rules:
        - alert: DemoWafAttackBlocked
          # 5분에 5건 넘게 막으면 공격 시도로 본다 (스캐너 한 번 지나가면 수십~수백 건).
          # 403 카운터는 파드가 처음 막는 순간 생긴다. 처음 보는 시계열은 increase() 가 0 이라(앞 표본이 없음)
          # 5분 안에 새로 생긴 시계열은 현재 값을 그대로 더한다 (11-27 실측: 15건 막았는데 increase 0).
          # sum by (namespace): Alertmanager 의 demo 경로(AlertmanagerConfig, namespace=demo 로 매칭)를 타려면 namespace 라벨이 남아야 한다
          expr: |
            sum by (namespace) (
              (increase(caddy_http_request_duration_seconds_count{namespace="demo", handler="waf", code="403"}[5m]) unless (caddy_http_request_duration_seconds_count{namespace="demo", handler="waf", code="403"} unless caddy_http_request_duration_seconds_count{namespace="demo", handler="waf", code="403"} offset 5m))
              or (caddy_http_request_duration_seconds_count{namespace="demo", handler="waf", code="403"} unless caddy_http_request_duration_seconds_count{namespace="demo", handler="waf", code="403"} offset 5m)
            ) > 5
          labels: { severity: warning, kube_chatops: "true", category: security }
          annotations:
            summary: 'demo 웹 방화벽이 5분 동안 {{ $value | printf "%.0f" }}건을 막음'
            description: 'Coraza(OWASP CRS) 가 SQLi·경로 조작·명령 주입·스캐너 같은 요청을 403 으로 막았다. 출발 IP 와 규칙은 Loki {namespace="demo", container="waf"} |= "WAF rule violation" 에서 본다.'
        - alert: DemoRateLimited
          # 한 IP 가 10초 100건을 넘겨 429 를 받은 요청이 5분에 50건 넘음 (스크레이핑, 무차별 대입, 작은 홍수).
          # 이미 거절 중이라 보고용. 어떤 IP 인지는 mcp-loki waf_blocks 의 rate_limited.
          expr: |
            sum by (namespace) (
              (increase(caddy_http_request_duration_seconds_count{namespace="demo", handler="rate_limit", code="429"}[5m]) unless (caddy_http_request_duration_seconds_count{namespace="demo", handler="rate_limit", code="429"} unless caddy_http_request_duration_seconds_count{namespace="demo", handler="rate_limit", code="429"} offset 5m))
              or (caddy_http_request_duration_seconds_count{namespace="demo", handler="rate_limit", code="429"} unless caddy_http_request_duration_seconds_count{namespace="demo", handler="rate_limit", code="429"} offset 5m)
            ) > 50
          labels: { severity: warning, kube_chatops: "true", category: security }
          annotations:
            summary: 'demo 웹 방화벽이 요청 수 제한으로 5분 동안 {{ $value | printf "%.0f" }}건을 거절함'
            description: '한 IP 가 10초에 100건을 넘겼다. 대량 요청이면 Cloudflare 쪽 차단이 더 싸다 (클러스터까지 오지 않음).'
        - alert: DemoWafDown
          expr: sum by (namespace) (up{namespace="demo", job="waf"}) < 1 or absent(up{namespace="demo", job="waf"})
          for: 3m
          labels: { severity: critical, kube_chatops: "true" }
          annotations:
            summary: 'demo 웹 방화벽 파드가 모두 내려감 (공개 주소와 load-gen 요청이 끊긴다)'
