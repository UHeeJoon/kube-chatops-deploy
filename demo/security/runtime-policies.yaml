# 웹셸 다음 단계의 공격을 커널에서 막는다 (demo 만). 웹셸 차단(tracingpolicy.yaml)을 피해 가는 길 세 가지.
# 같은 실행 규칙 일부를 클러스터 전체에서는 기록만 한다 (homelab components/operators/tetragon-policies/dropper-audit.yaml).
# 걸리면 tetragon_policy_events_total{policy=...} 이 오르고 → prometheusrule.yaml 알림 → n8n → (격리) → 에이전트 조사 → Slack.
#
# 1) webroot-tamper-block: 웹 서버가 웹 루트·시스템 경로에 쓰기 → 그 쓰기만 거부(EPERM). 프로세스는 살려 둔다
#    (서버 본체가 쓰는 경우라 죽이면 서비스 장애). 업로드 취약점으로 웹셸 파일을 심는 단계를 막는다.
# 2) dropper-block: 임시 경로(/tmp, /dev/shm, memfd)나 웹 루트에 있는 파일 실행 → 그 프로세스 종료.
#    셸 없이 내려받은 실행 파일을 바로 띄우는 우회(proc_open 배열, Runtime.exec 직접 실행)를 막는다.
# 3) privesc-block: su·sudo·pkexec·nsenter 실행, setuid/setgid 비트 설정(chmod +s) → 그 프로세스 종료.
#
# 쓰기 거부는 kprobe Override 로 한다. 이 커널(el10 6.12)은 bpf_override_return 이 없어 Tetragon 이 fmod_ret 로 대신한다
# (Tetragon 에 --disable-kprobe-multi 필요, homelab apps/operators/tetragon.yaml). BPF LSM 훅(lsmhooks)은 Tetragon 1.8 의
# 프로그램이 이 커널 검증기 한도(명령 100만 개)를 넘어 가장 단순한 정책도 로드되지 않았다 (11-27 확인).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: webroot-tamper-block
  namespace: demo
spec:
  kprobes:
    - call: security_file_permission # 열린 파일에 읽기·쓰기할 때마다 (mask 로 쓰기만 고른다)
      syscall: false
      args:
        - { index: 0, type: file }
        - { index: 1, type: int }
      selectors:
        - matchBinaries:
            - operator: Postfix
              values: [/java, /php, /php-fpm, /php-cgi, /apache2, /httpd, /nginx, /node, /python3, /python3.12] # demo-app(uvicorn)의 실행 파일은 python3.12
          matchArgs:
            - index: 0
              operator: Prefix
              # /usr 하나로 /usr/bin·/usr/lib·/usr/share/nginx 를, merged-usr 배포판에서는 /bin·/lib 도 덮는다 (실제 경로로 비교).
              values: [/var/www/, /app/, /etc/, /usr/]
            - index: 1
              operator: Mask
              values: ["10"] # MAY_WRITE(2) | MAY_APPEND(8)
          matchActions:
            - action: Override
              argError: -1 # EPERM: 쓰기만 실패
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: dropper-block
  namespace: demo
spec:
  kprobes:
    - call: security_bprm_creds_for_exec
      syscall: false
      args:
        - { index: 0, type: linux_binprm }
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              # memfd(파일 없는 실행)는 runc 도 자기 복제에 써서 차단하면 파드 시작·exec 가 깨질 수 있다 → 클러스터 기록(dropper-audit)으로 먼저 본다
              values: [/tmp/, /dev/shm/, /var/tmp/, /run/, /var/www/]
          matchActions:
            - action: Sigkill
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: privesc-block
  namespace: demo
spec:
  kprobes:
    - call: security_bprm_creds_for_exec # 권한을 바꾸는 도구 실행
      syscall: false
      args:
        - { index: 0, type: linux_binprm }
      selectors:
        - matchArgs:
            - index: 0
              operator: Postfix
              values: [/su, /sudo, /pkexec, /doas, /nsenter, /unshare, /capsh, /setcap, /chroot]
          matchActions:
            - action: Sigkill
    # busybox 계열 이미지는 /bin/su 가 busybox 로 가는 링크라 위 훅(실제 실행 파일을 본다)에 걸리지 않는다 (11-27 확인).
    # 시스템 호출에 넘긴 경로로도 막는다. `busybox su` 처럼 직접 부르는 것은 여전히 못 막는다
    # (setuid 가 없는 busybox 의 su 는 권한을 올리지 못하고, nsenter·unshare 는 파드가 capability 를 모두 버려 실패한다).
    - call: sys_execve
      syscall: true
      args:
        - { index: 0, type: string }
      selectors:
        - matchArgs:
            - index: 0
              operator: Postfix
              values: [/su, /sudo, /pkexec, /doas, /nsenter, /unshare, /capsh, /setcap, /chroot]
          matchActions:
            - action: Sigkill
    # chmod u+s / g+s: 나중에 root 로 실행될 문을 만든다. 모든 chmod 계열 시스템 호출이 지나는 보안 훅에서 막는다.
    # 시스템 호출에 Sigkill 만 걸면 호출은 끝난 뒤 죽어서 비트가 이미 붙는다 (11-27 재현: rc=137 인데 -rwsr-xr-x).
    # 그래서 Override 로 호출 자체를 실패시키고(EPERM) 그 프로세스도 죽인다.
    - call: security_path_chmod
      syscall: false
      args:
        - { index: 0, type: path }
        - { index: 1, type: int }
      selectors:
        - matchArgs:
            - index: 1
              operator: Mask
              values: ["3072"] # S_ISUID(04000) | S_ISGID(02000)
          matchActions:
            - action: Override
              argError: -1
            - action: Sigkill
