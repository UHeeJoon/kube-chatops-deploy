# 격리: security.kube-chatops/quarantine=true 라벨이 붙은 파드는 들고 나는 통신을 모두 막는다.
# Deny 규칙은 다른 어떤 허용 정책보다 우선한다.
# 같은 노드의 kubelet(호스트) 은 막지 않는다: probe 가 실패해 컨테이너가 재시작되면 메모리 속 증거가 사라진다.
# kubectl logs·exec 는 네트워크가 아니라 kubelet 을 거치므로 계속 된다 (증거 확인용).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: quarantine
  namespace: demo
spec:
  endpointSelector:
    matchLabels: { security.kube-chatops/quarantine: "true" }
  ingressDeny:
    - fromEntities: [world, remote-node, ingress, kube-apiserver]
    - fromEndpoints: # 모든 ns 의 모든 파드
        - matchExpressions:
            - { key: io.kubernetes.pod.namespace, operator: Exists }
  egressDeny:
    - toEntities: [all]
