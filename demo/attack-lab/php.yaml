# 보안 검증용 취약 앱 (PHP 웹셸 흉내). README.md 참고. 외부 노출 없음.
apiVersion: v1
kind: ConfigMap
metadata:
  name: attack-lab-php
  namespace: demo
data:
  index.php: |
    <?php echo "ok\n";
  cmd.php: |
    <?php
    // 일부러 취약: 요청 값을 그대로 셸에서 실행한다 (업로드된 웹셸과 같은 동작)
    header('Content-Type: text/plain');
    echo shell_exec($_GET['c'] ?? 'id');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-lab-php
  namespace: demo
  labels: { app.kubernetes.io/name: attack-lab-php, app.kubernetes.io/part-of: kube-chatops, kube-chatops/purpose: security-test }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: attack-lab-php }
  template:
    metadata:
      labels: { app.kubernetes.io/name: attack-lab-php, kube-chatops/purpose: security-test }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: php
          image: php:8.4-apache@sha256:95c1a1dfaaffef4bcfee563838c50620457a3c00196c4bf5ddb66934d707fea2
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /index.php, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: # apache 는 root 로 80 을 열고 www-data 로 내려간다 → 그 두 가지 권한만 남긴다
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE, SETUID, SETGID] }
          volumeMounts:
            - { name: code, mountPath: /var/www/html, readOnly: true }
      volumes:
        - name: code
          configMap: { name: attack-lab-php }
