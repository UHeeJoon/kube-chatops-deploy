# 보안 검증용 취약 앱 (Java 원격 명령 실행 흉내). README.md 참고. 외부 노출 없음.
apiVersion: v1
kind: ConfigMap
metadata:
  name: attack-lab-java
  namespace: demo
data:
  Vuln.java: |
    import com.sun.net.httpserver.HttpServer;
    import java.net.InetSocketAddress;
    import java.net.URLDecoder;
    import java.nio.charset.StandardCharsets;

    // 일부러 취약: /run?c=<명령> 을 그대로 셸에서 실행한다 (Log4Shell 같은 원격 실행의 마지막 단계와 같은 동작)
    public class Vuln {
        public static void main(String[] args) throws Exception {
            HttpServer s = HttpServer.create(new InetSocketAddress(8080), 0);
            s.createContext("/healthz", ex -> { byte[] b = "ok\n".getBytes(); ex.sendResponseHeaders(200, b.length); ex.getResponseBody().write(b); ex.close(); });
            s.createContext("/run", ex -> {
                String q = ex.getRequestURI().getRawQuery();
                String cmd = q != null && q.startsWith("c=") ? URLDecoder.decode(q.substring(2), StandardCharsets.UTF_8) : "id";
                byte[] out;
                try {
                    Process p = new ProcessBuilder("sh", "-c", cmd).redirectErrorStream(true).start();
                    out = p.getInputStream().readAllBytes();
                    out = (new String(out) + "exit=" + p.waitFor() + "\n").getBytes();
                } catch (Exception e) {
                    out = ("error: " + e + "\n").getBytes();
                }
                ex.sendResponseHeaders(200, out.length); ex.getResponseBody().write(out); ex.close();
            });
            s.start();
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-lab-java
  namespace: demo
  labels: { app.kubernetes.io/name: attack-lab-java, app.kubernetes.io/part-of: kube-chatops, kube-chatops/purpose: security-test }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: attack-lab-java }
  template:
    metadata:
      labels: { app.kubernetes.io/name: attack-lab-java, kube-chatops/purpose: security-test }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: java
          image: eclipse-temurin:21-jdk-alpine@sha256:c07bb82e004a166b5d3d63b84ad70e2e822f228505e2e0c0b8dfdc2890d22f13
          command: [java, -Xmx64m, -XX:-UsePerfData, /app/Vuln.java] # 단일 파일 실행 (메모리에서 컴파일)
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: code
          configMap: { name: attack-lab-java }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
