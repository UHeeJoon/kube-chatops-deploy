# demo-app 알림 규칙. Prometheus 는 release=kube-prometheus 라벨이 있는 규칙만 읽는다.
# 알림이 뜨면 아래 AlertmanagerConfig 가 n8n(WF-02)으로 보내고, 에이전트가 조사해 Slack 스레드에 보고한다.
# 집계할 때 namespace 라벨을 꼭 남긴다: AlertmanagerConfig 는 namespace="demo" 인 알림만 받는다 (OnNamespace).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app
  namespace: demo
  labels: { release: kube-prometheus, app.kubernetes.io/part-of: kube-chatops }
spec:
  groups:
    - name: demo-app
      rules:
        - alert: DemoHighErrorRate
          # 5xx 비율. 장애 주입 API(/chaos/*)와 메트릭 수집 경로는 뺀다
          expr: |
            sum by (namespace) (rate(http_requests_total{namespace="demo", path!~"/chaos/.*|/metrics|/healthz.*", status=~"5.."}[2m]))
              / sum by (namespace) (rate(http_requests_total{namespace="demo", path!~"/chaos/.*|/metrics|/healthz.*"}[2m])) > 0.05
          for: 2m
          labels: { severity: warning, kube_chatops: "true" }
          annotations:
            summary: "demo-app 5xx 비율이 5%를 넘었습니다 (현재 {{ $value | humanizePercentage }})"
        - alert: DemoHighLatency
          expr: |
            histogram_quantile(0.95, sum by (namespace, le) (rate(http_request_duration_seconds_bucket{namespace="demo", path!~"/chaos/.*|/metrics|/healthz.*"}[5m]))) > 0.5
          for: 3m
          labels: { severity: warning, kube_chatops: "true" }
          annotations:
            summary: "demo-app p95 응답 시간이 500ms 를 넘었습니다 (현재 {{ $value | humanizeDuration }})"
        - alert: DemoMemoryNearLimit
          # kubelet 메트릭이 두 Service 로 중복 수집되고 있어 max by (pod) 로 하나만 본다
          expr: |
            max by (namespace, pod) (container_memory_working_set_bytes{namespace="demo", container="app"})
              / max by (namespace, pod) (kube_pod_container_resource_limits{namespace="demo", container="app", resource="memory"}) > 0.8
          for: 2m
          labels: { severity: warning, kube_chatops: "true" }
          annotations:
            summary: "{{ $labels.pod }} 메모리가 limit 의 80%를 넘었습니다 ({{ $value | humanizePercentage }})"
        # 이상 탐지 모델의 판정을 알림으로 (11-28). 모델은 지연·오류에서는 위 규칙보다 빠르지 않지만(0~1분),
        # 메모리가 천천히 차오르는 누수는 한도 80% 알림보다 4~22분 먼저 잡았다 (증가 속도 특성).
        # z 4 = 분당 한도의 2% (평소 최대 0.3%). 재시작 직후 5분은 특성이 비어 있어 걸리지 않는다.
        - alert: DemoMemoryLeakSuspected
          expr: |
            max(anomaly_model_feature_z{feature="mem_growth"}) >= 4
              unless on() (count(ALERTS{namespace="demo", alertname="DemoMemoryNearLimit", alertstate="firing"}) > 0)
          for: 5m
          labels: { severity: warning, kube_chatops: "true", namespace: demo }
          annotations:
            summary: "demo-app 메모리가 평소보다 빠르게 늘고 있습니다 (증가 속도 z = {{ $value | printf \"%.1f\" }}). 아직 한도 80% 전입니다"
        # 모델은 이상이라는데 demo 의 다른 알림이 하나도 없을 때. 임계값 규칙이 모르는 종류의 문제를 조사로 넘긴다.
        # v8 이후 이런 판정은 0건이었다 (약 30시간). 소음이 생기면 for 를 늘린다.
        - alert: DemoAnomalyUnexplained
          expr: |
            max(anomaly_model_is_anomaly{rule="hybrid"}) == 1
              unless on() (count(ALERTS{namespace="demo", alertname!="DemoAnomalyUnexplained"}) > 0)
          for: 5m
          labels: { severity: warning, kube_chatops: "true", namespace: demo }
          annotations:
            summary: "이상 탐지 모델이 5분 넘게 이상으로 판정하는데 해당하는 알림이 없습니다"
            description: "어느 지표가 벗어났는지는 detect_anomalies 의 main_signal 과 z 로 확인합니다."
        - alert: DemoPodRestarting
          expr: max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace="demo"}[10m])) >= 1
          labels: { severity: warning, kube_chatops: "true" }
          annotations:
            summary: "{{ $labels.pod }} 가 최근 10분 안에 재시작했습니다"
