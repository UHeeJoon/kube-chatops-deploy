# Grafana 대시보드: 상황판 (울리는 알림, 서비스 상태, 공격과 조치, 격리된 파드).
# Grafana 사이드카가 모든 ns 에서 grafana_dashboard=1 라벨 ConfigMap 을 읽는다.
# 수정은 Grafana 에서 하지 말고 생성기에서: python3 scripts/gen-incident-dashboard.py demo/alerts/dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-dashboard
  namespace: demo
  labels:
    grafana_dashboard: "1"
data:
  kube-chatops-incident.json: |
    {
     "uid": "kube-chatops-incident",
     "title": "kube-chatops / 상황판",
     "tags": [
      "kube-chatops",
      "security",
      "incident"
     ],
     "timezone": "Asia/Seoul",
     "refresh": "30s",
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "schemaVersion": 39,
     "editable": true,
     "templating": {
      "list": [
       {
        "name": "datasource",
        "label": "Prometheus",
        "type": "datasource",
        "query": "prometheus",
        "current": {},
        "hide": 0
       },
       {
        "name": "loki",
        "label": "Loki",
        "type": "datasource",
        "query": "loki",
        "current": {},
        "hide": 0
       }
      ]
     },
     "links": [
      {
       "title": "이상 탐지 모델",
       "type": "link",
       "url": "/d/kube-chatops-anomaly-model",
       "icon": "dashboard"
      }
     ],
     "panels": [
      {
       "type": "row",
       "title": "지금",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "stat",
       "title": "울리는 알림",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "count(ALERTS{alertstate=\"firing\", kube_chatops=\"true\"}) or vector(0)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value"
       },
       "description": "kube-chatops 가 다루는 알림(Slack 으로 조사·보고가 가는 것) 중 지금 firing 인 수"
      },
      {
       "type": "stat",
       "title": "이상 탐지 모델",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 4,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "max(anomaly_model_is_anomaly{rule=\"hybrid\"}) or vector(0)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "0": {
             "text": "정상",
             "color": "green"
            },
            "1": {
             "text": "이상",
             "color": "red"
            }
           }
          }
         ],
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value"
       },
       "description": "학습된 모델의 마지막 1분 판정 (요청 수, 오류율, 지연, 메모리)"
      },
      {
       "type": "stat",
       "title": "격리된 파드",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "count(kube_pod_owner{namespace=\"demo\", owner_kind=\"<none>\"}) or vector(0)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value"
       },
       "description": "선 조치로 격리된 파드 (라벨을 떼어 ReplicaSet 에서 분리됨, 모든 통신 차단). 조사 끝나면 Slack 의 [격리 파드 삭제]"
      },
      {
       "type": "stat",
       "title": "커널 차단 (24시간)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "sum((increase(tetragon_policy_events_total{namespace=\"demo\", policy=~\".*-block\"}[24h]) unless (tetragon_policy_events_total{namespace=\"demo\", policy=~\".*-block\"} unless tetragon_policy_events_total{namespace=\"demo\", policy=~\".*-block\"} offset 24h)) or (tetragon_policy_events_total{namespace=\"demo\", policy=~\".*-block\"} unless tetragon_policy_events_total{namespace=\"demo\", policy=~\".*-block\"} offset 24h)) or vector(0)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "decimals": 0,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value"
       },
       "description": "Tetragon 이 커널에서 막은 시도 (웹셸 실행, 웹 루트 쓰기, 투하 실행, 권한 상승)"
      },
      {
       "type": "stat",
       "title": "WAF 차단 (24시간)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "sum((increase(caddy_http_request_duration_seconds_count{namespace=\"demo\", code=\"403\"}[24h]) unless (caddy_http_request_duration_seconds_count{namespace=\"demo\", code=\"403\"} unless caddy_http_request_duration_seconds_count{namespace=\"demo\", code=\"403\"} offset 24h)) or (caddy_http_request_duration_seconds_count{namespace=\"demo\", code=\"403\"} unless caddy_http_request_duration_seconds_count{namespace=\"demo\", code=\"403\"} offset 24h)) or vector(0)",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "decimals": 0,
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "orange",
            "value": 1
           },
           {
            "color": "red",
            "value": 100
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "value"
       },
       "description": "웹 방화벽(Coraza, OWASP CRS)이 403 으로 막은 요청 (SQLi, 경로 조작, 명령 주입, 스캐너 등)"
      },
      {
       "type": "stat",
       "title": "demo 오류율 / p95",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 20,
        "y": 1,
        "w": 4,
        "h": 5
       },
       "targets": [
        {
         "expr": "sum(rate(http_requests_total{namespace=\"demo\", path!~\"/chaos/.*|/metrics|/healthz.*\", status=~\"5..\"}[2m])) / sum(rate(http_requests_total{namespace=\"demo\", path!~\"/chaos/.*|/metrics|/healthz.*\"}[2m])) or vector(0)",
         "legendFormat": "오류율",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        },
        {
         "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\", path!~\"/chaos/.*|/metrics|/healthz.*\"}[2m])))",
         "legendFormat": "p95",
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {},
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "오류율"
          },
          "properties": [
           {
            "id": "unit",
            "value": "percentunit"
           },
           {
            "id": "thresholds",
            "value": {
             "mode": "absolute",
             "steps": [
              {
               "color": "green",
               "value": null
              },
              {
               "color": "orange",
               "value": 0.01
              },
              {
               "color": "red",
               "value": 0.05
              }
             ]
            }
           }
          ]
         },
         {
          "matcher": {
           "id": "byName",
           "options": "p95"
          },
          "properties": [
           {
            "id": "unit",
            "value": "s"
           },
           {
            "id": "thresholds",
            "value": {
             "mode": "absolute",
             "steps": [
              {
               "color": "green",
               "value": null
              },
              {
               "color": "orange",
               "value": 0.3
              },
              {
               "color": "red",
               "value": 1
              }
             ]
            }
           }
          ]
         }
        ]
       },
       "options": {
        "colorMode": "value",
        "graphMode": "area",
        "textMode": "value_and_name"
       },
       "description": "최근 2분"
      },
      {
       "type": "row",
       "title": "알림",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 6,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "table",
       "title": "지금 울리는 알림",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 7,
        "w": 10,
        "h": 8
       },
       "targets": [
        {
         "expr": "ALERTS{alertstate=\"firing\", kube_chatops=\"true\"}",
         "legendFormat": "",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "format": "table",
         "instant": true,
         "range": false
        }
       ],
       "fieldConfig": {
        "defaults": {},
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "심각도"
          },
          "properties": [
           {
            "id": "custom.cellOptions",
            "value": {
             "type": "color-text"
            }
           },
           {
            "id": "mappings",
            "value": [
             {
              "type": "value",
              "options": {
               "critical": {
                "color": "red"
               },
               "warning": {
                "color": "orange"
               }
              }
             }
            ]
           }
          ]
         }
        ]
       },
       "options": {},
       "description": "누가 처리 중인지는 Slack 알림 채널의 스레드에서 본다",
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "Value": true,
           "__name__": true,
           "alertstate": true,
           "kube_chatops": true,
           "prometheus": true,
           "container": true,
           "endpoint": true,
           "instance": true,
           "job": true,
           "service": true
          },
          "indexByName": {
           "alertname": 0,
           "severity": 1,
           "category": 2,
           "namespace": 3,
           "pod": 4
          },
          "renameByName": {
           "alertname": "알림",
           "severity": "심각도",
           "category": "분류",
           "namespace": "ns",
           "pod": "파드",
           "auto_action": "선 조치"
          }
         }
        }
       ]
      },
      {
       "type": "state-timeline",
       "title": "알림 흐름 (언제 울렸나)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 10,
        "y": 7,
        "w": 14,
        "h": 8
       },
       "targets": [
        {
         "expr": "max by (alertname) (ALERTS{alertstate=\"firing\", kube_chatops=\"true\"})",
         "legendFormat": "{{alertname}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "color": {
          "mode": "fixed",
          "fixedColor": "red"
         },
         "custom": {
          "fillOpacity": 80,
          "lineWidth": 0
         },
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "firing",
             "color": "red"
            }
           }
          }
         ]
        },
        "overrides": []
       },
       "options": {
        "showValue": "never",
        "mergeValues": true,
        "rowHeight": 0.8,
        "legend": {
         "showLegend": false
        }
       },
       "description": "빨간 막대 = firing 이던 시간"
      },
      {
       "type": "row",
       "title": "서비스 상태 (장애)",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 15,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "요청 수 · 5xx",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 16,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "sum(rate(http_requests_total{namespace=\"demo\", path!~\"/chaos/.*|/metrics|/healthz.*\"}[2m]))",
         "legendFormat": "요청/s",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        },
        {
         "expr": "sum(rate(http_requests_total{namespace=\"demo\", path!~\"/chaos/.*|/metrics|/healthz.*\", status=~\"5..\"}[2m]))",
         "legendFormat": "5xx/s",
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "5xx/s"
          },
          "properties": [
           {
            "id": "color",
            "value": {
             "mode": "fixed",
             "fixedColor": "red"
            }
           }
          ]
         }
        ]
       },
       "options": {}
      },
      {
       "type": "timeseries",
       "title": "p95 지연",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 16,
        "w": 5,
        "h": 7
       },
       "targets": [
        {
         "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\", path!~\"/chaos/.*|/metrics|/healthz.*\"}[2m])))",
         "legendFormat": "p95",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "timeseries",
       "title": "메모리 (한도 대비, 파드별)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 13,
        "y": 16,
        "w": 6,
        "h": 7
       },
       "targets": [
        {
         "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"demo\", container=\"app\"}) / max by (pod) (kube_pod_container_resource_limits{namespace=\"demo\", container=\"app\", resource=\"memory\"})",
         "legendFormat": "{{pod}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "max": 1
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "type": "timeseries",
       "title": "재시작 (구간별)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 19,
        "y": 16,
        "w": 5,
        "h": 7
       },
       "targets": [
        {
         "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"demo\"}[$__interval]))",
         "legendFormat": "{{pod}}",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "bars",
          "fillOpacity": 80
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "OOMKilled 등으로 다시 뜬 횟수",
       "interval": "5m"
      },
      {
       "type": "row",
       "title": "보안 (공격과 조치)",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 23,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "요청 차단 (구간별)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 24,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "sum(increase(caddy_http_request_duration_seconds_count{namespace=\"demo\", code=\"403\"}[$__interval]))",
         "legendFormat": "WAF 규칙 (403)",
         "refId": "A",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        },
        {
         "expr": "sum(increase(caddy_http_request_duration_seconds_count{namespace=\"demo\", handler=\"rate_limit\", code=\"429\"}[$__interval]))",
         "legendFormat": "요청 수 제한 (429)",
         "refId": "B",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        },
        {
         "expr": "sum by (realm) (increase(keycloak_user_events_total{event=\"login\", error!=\"\"}[$__interval]))",
         "legendFormat": "keycloak 로그인 실패 ({{realm}})",
         "refId": "C",
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         }
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "bars",
          "fillOpacity": 80,
          "stacking": {
           "mode": "normal"
          }
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "403: 5분 5건 초과 DemoWafAttackBlocked. 429: IP 당 10초 100건 초과, 5분 50건 초과 DemoRateLimited. 로그인 실패: 5분 20건 초과 KeycloakLoginFailuresHigh (플랫폼 알림이라 Slack 보고 없음)",
       "interval": "5m"
      },
      {
       "type": "timeseries",
       "title": "커널 차단 (정책별, 구간별)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 24,
        "w": 8,
        "h": 7
       },
       "targets": [
        {
         "expr": "sum by (policy) (increase(tetragon_policy_events_total{namespace=\"demo\", policy=~\".*-block\"}[$__interval]))",
         "legendFormat": "{{policy}}",
         "refId": "A",
         "datasource": {
