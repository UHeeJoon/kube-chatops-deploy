apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels: { app.kubernetes.io/name: demo-app }
spec:
  selector: { app.kubernetes.io/name: demo-app }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: demo
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: demo-app }
  endpoints:
    - { port: http, path: /metrics, interval: 15s }
