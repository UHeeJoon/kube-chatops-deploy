# MLflow 서버 DB 연결 문자열. 비밀번호는 Vault secret/kube-chatops/mlops 의 mlflow_db_password.
# aiops 의 aiops-pg-mlflow (CNPG managed role) 도 같은 Vault 값을 읽는다.
# 다른 DB 계정처럼 클러스터 안에서 생성하지 않는 이유: 네임스페이스(aiops, mlops)가 달라 같은 값을 나눠 쓸 수 없다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-db
  namespace: mlops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: mlflow-db
    creationPolicy: Owner
    template:
      data:
        MLFLOW_BACKEND_STORE_URI: "postgresql://mlflow:{{ .password | urlquery }}@aiops-pg-rw.aiops.svc:5432/mlflow"
  data:
    - { secretKey: password, remoteRef: { key: kube-chatops/mlops, property: mlflow_db_password } }
