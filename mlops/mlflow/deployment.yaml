# MLflow tracking + model registry (실험 기록, 모델 버전, alias champion/challenger).
# 메타데이터: aiops-pg 의 mlflow DB. 아티팩트: 서버가 MinIO s3://mlops/mlflow 로 프록시 (클라이언트는 MinIO 키가 필요 없다).
# 호출자: 학습 파이프라인(mlops ns). UI 는 port-forward 로 본다 (외부 노출 안 함).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
  labels: { app.kubernetes.io/name: mlflow, app.kubernetes.io/part-of: kube-chatops }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: mlflow }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mlflow, app.kubernetes.io/part-of: kube-chatops }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mlflow
          image: ghcr.io/uheejoon/kube-chatops/mlflow@sha256:da88a2c4f9ba696fd1ca895b4e524947354f930062868cb6bda1a5092e8ba6f4
          ports:
            - { name: http, containerPort: 5000 }
          envFrom:
            - secretRef: { name: mlflow-db } # MLFLOW_BACKEND_STORE_URI
            - secretRef: { name: mlops-s3 } # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
          env:
            - { name: MLFLOW_HOST, value: 0.0.0.0 }
            - { name: MLFLOW_PORT, value: "5000" }
            - { name: MLFLOW_WORKERS, value: "1" } # 호출자가 학습 파이프라인뿐. 워커마다 MLflow 전체를 올려 메모리가 크다
            - { name: MLFLOW_ARTIFACTS_DESTINATION, value: s3://mlops/mlflow }
            - { name: MLFLOW_S3_ENDPOINT_URL, value: http://minio.storage.svc.cluster.local }
            # MLflow 3 의 GenAI 작업 실행기(huey 작업자 8개, 각 약 240MB)를 끈다. 이 프로젝트는 쓰지 않는다.
            - { name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION, value: "false" }
            # Host 헤더 검사 (DNS rebinding 방지). 기본값은 localhost 와 사설 IP 뿐이라 서비스 이름을 넣는다.
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "mlflow.mlops.svc.cluster.local:5000,mlflow.mlops.svc:5000,mlflow.mlops:5000,mlflow:5000,localhost:*,127.0.0.1:*"
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: http, httpHeaders: [{ name: Host, value: "localhost:5000" }] }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http, httpHeaders: [{ name: Host, value: "localhost:5000" }] }
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet: { path: /health, port: http, httpHeaders: [{ name: Host, value: "localhost:5000" }] }
            periodSeconds: 5
            failureThreshold: 36 # 첫 기동 때 DB 스키마를 만든다
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
  labels: { app.kubernetes.io/name: mlflow }
spec:
  selector: { app.kubernetes.io/name: mlflow }
  ports:
    - { name: http, port: 5000, targetPort: http }
