# demo 서비스 이상 탐지 모델 서빙 (KServe Standard 모드: Deployment + Service demo-anomaly-predictor).
# 모델 버전은 STORAGE_URI 로 Git 에 고정한다. 바꾸는 커밋이 곧 champion 승격이다.
#   지금: demo-anomaly v11 (MLflow model m-6fce51081dcc4caabe124e5edf7899ca, 평가 F1 0.933, 2026. 11. 28. 2시 29분 59초 Slack 승인 U0B330BGTJA)
# storage-initializer 가 ServiceAccount anomaly-serve 의 Secret(mlops-s3) 으로 MinIO 에서 /mnt/models 로 내려받는다.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: demo-anomaly
  namespace: mlops
  labels: { app.kubernetes.io/part-of: kube-chatops }
spec:
  predictor:
    serviceAccountName: anomaly-serve
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: ghcr.io/uheejoon/kube-chatops/anomaly-serve@sha256:dc87e031a6fd17e470da36707e3009b8406cdfadfd3313c603ccf7e7c3819797
        args: [--model_name=demo-anomaly, --http_port=8080]
        env:
          - name: STORAGE_URI
            value: s3://mlops/mlflow/1/models/m-6fce51081dcc4caabe124e5edf7899ca/artifacts
        ports:
          - { containerPort: 8080, protocol: TCP }
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 512Mi } # 사용 약 200Mi (11-28 측정). 모델을 읽을 때 잠깐 더 쓴다
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          seccompProfile: { type: RuntimeDefault }
