# 이상 탐지가 멈췄는지 감시한다 (11-27).
# v8 승격 직후 예측 서버가 모든 요청에 500 을 냈는데(입력 열 불일치) 15분 동안 아무 알림이 없었다.
# 탐지기(mcp-anomaly)는 1분마다 판정하고 성공 시각을 지표로 남긴다. 5분 넘게 성공이 없으면 알린다.
# kube_chatops 라벨이 없으므로 에이전트 조사 없이 플랫폼 알림(Alertmanager → Slack)으로 간다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: anomaly-monitor
  namespace: mlops
  labels:
    release: kube-prometheus
spec:
  groups:
    - name: anomaly-monitor
      rules:
        - alert: AnomalyMonitorStale
          expr: time() - max(anomaly_monitor_last_success_timestamp_seconds) > 300
          for: 1m
          labels: { severity: warning, namespace: mlops }
          annotations:
            summary: '이상 탐지가 {{ $value | humanizeDuration }} 동안 판정하지 못함'
            description: '예측 서버(demo-anomaly-predictor) 오류이거나 탐지기(mcp-anomaly)가 멈췄다. 모델 승격 직후라면 kubectl -n mlops logs deploy/demo-anomaly-predictor -c kserve-container 를 보고, 급하면 Slack 의 이전 버전 카드에서 되돌린다.'
        - alert: AnomalyMonitorAbsent
          expr: absent(anomaly_monitor_last_success_timestamp_seconds)
          for: 10m
          labels: { severity: warning, namespace: mlops }
          annotations:
            summary: '이상 탐지기(mcp-anomaly) 지표가 없음'
            description: 'mcp-anomaly 파드가 없거나 수집되지 않는다.'
        # 기준 이동 (11-28): 모델의 "평소" 는 학습 기간의 평균이다. 배포로 메모리 사용량이 달라지거나 트래픽 수준이 바뀌면
        # 장애가 아닌데도 z 가 한쪽으로 치우친 채 머문다. 6시간 중앙값은 짧은 장애(수십 분)에는 움직이지 않으므로,
        # 이것이 2(이상 한계 4 의 절반)를 넘으면 세상이 바뀐 것이다 → 재학습. 지난 24시간 최댓값은 0.72.
        - alert: AnomalyBaselineDrift
          expr: max by (feature) (abs(quantile_over_time(0.5, (max by (feature) (anomaly_model_feature_z))[6h:1m]))) > 2
          for: 30m
          # demo 서비스의 평소 기준에 대한 알림이라 namespace 를 demo 로 둔다. Alertmanager 의 매처가 네임스페이스 기준이라
          # 이렇게 해야 demo 의 AlertmanagerConfig 를 타고 에이전트 조사로 넘어간다 → 보고서에 '재학습 시작' 버튼 (operator 승인).
          # 자동으로 재학습을 제출하지 않는다: 실행은 사람이 승인한다는 원칙을 재학습에도 그대로 둔다.
          labels: { severity: warning, namespace: demo, kube_chatops: "true" }
          annotations:
            summary: '이상 탐지 모델의 평소 기준이 지금과 다름 ({{ $labels.feature }} 의 6시간 중앙값 z = {{ $value | printf "%.1f" }})'
            description: '{{ $labels.feature }} 가 6시간 넘게 학습 때의 평소 값에서 벗어나 있다. 장애가 아니라 평소 수준이 바뀐 것이면(배포, 트래픽 변화) Slack 에서 재학습을 실행하고, 결과를 보고 승격한다.'
