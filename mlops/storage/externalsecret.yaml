# MinIO 접근 키 (Vault secret/kube-chatops/mlops). 버킷 mlops 하나만 읽고 쓰는 전용 사용자다 (homelab minio-provision 이 만든다).
# Secret mlops-s3 를 세 곳이 쓴다.
#   - 학습 파이프라인 스텝: 단계 사이 데이터(data/) 읽기·쓰기 (envFrom)
#   - MLflow 서버: 아티팩트 프록시(mlflow/) (envFrom)
#   - KServe storage-initializer: 모델 다운로드. ServiceAccount anomaly-serve 에 붙여 두면 KServe 가 아래 주석을 읽어 S3 설정을 만든다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-s3
  namespace: mlops
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: mlops-s3
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: minio.storage.svc.cluster.local
          serving.kserve.io/s3-usehttps: "0"
          serving.kserve.io/s3-region: us-east-1
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        AWS_DEFAULT_REGION: us-east-1
  data:
    - { secretKey: access_key, remoteRef: { key: kube-chatops/mlops, property: minio_access_key } }
    - { secretKey: secret_key, remoteRef: { key: kube-chatops/mlops, property: minio_secret_key } }
