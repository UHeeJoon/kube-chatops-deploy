# 학습 파이프라인 스텝 파드 (Argo Workflows, 라벨 app.kubernetes.io/name=anomaly-train)
# 들어옴: 없음.
# 나감: Prometheus(9090), MinIO(storage:9000), MLflow(5000), n8n(aiops:5678, 학습 결과 알림),
#       kube-apiserver(Argo 실행기가 스텝 결과를 기록). DNS 는 기준선이 허용.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: anomaly-train, namespace: mlops }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: anomaly-train }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { port: 9090, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: storage }
          podSelector:
            matchLabels: { v1.min.io/tenant: myminio }
      ports:
        - { port: 9000, protocol: TCP }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mlflow }
      ports:
        - { port: 5000, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aiops }
          podSelector:
            matchLabels: { app.kubernetes.io/name: n8n }
      ports:
        - { port: 5678, protocol: TCP }
---
# Argo 실행기(argoexec)가 WorkflowTaskResult 를 쓰려면 apiserver 에 닿아야 한다.
# Cilium 은 apiserver 를 예약 신원으로 보므로 NetworkPolicy 가 아니라 CiliumNetworkPolicy 로 연다.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: anomaly-train-apiserver, namespace: mlops }
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: anomaly-train }
  egress:
    - toEntities: [kube-apiserver]
