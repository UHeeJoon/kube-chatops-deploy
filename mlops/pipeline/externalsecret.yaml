# 학습 결과를 n8n WF-04 webhook 으로 보낼 때 쓰는 토큰. n8n 쪽(aiops/n8n n8n-mlops)도 같은 Vault 값을 읽는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-n8n-webhook
  namespace: mlops
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: SecretStore }
  target: { name: mlops-n8n-webhook, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: kube-chatops/mlops, property: n8n_webhook_token }
